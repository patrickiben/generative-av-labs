<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Chimera Synth</title>
<meta name="description" content="A synth you breed by ear: animal voices, a playable genome and a phase-checked sub, synthesized live in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23b8b7ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23b8b7ff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: Georgia, "Times New Roman", serif;
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 540px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.5) 0%, transparent 18%, transparent 58%, rgba(5, 8, 18, 0.72) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }

.header { position: absolute; left: 42px; right: 42px; top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(12px); transition: background 0.25s; }
.top-action:hover { background: var(--soft); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.35s, color 0.35s; }
.mode-switch button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 10px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); padding: 4px 7px; border-radius: 10px; border: 1px solid transparent; transition: background 0.18s, border-color 0.18s, color 0.18s; }
.hitdot:hover { background: var(--soft); border-color: var(--line); color: var(--ink); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }
.stage-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); box-shadow: 0 8px 30px var(--shadow); }
.stage-bar .pill { padding: 6px 13px; font-size: 11px; }
.stage-bar .stage-slider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.stage-bar .stage-slider input[type="range"] { width: clamp(120px, 18vw, 200px); }
.stage-bar .stage-slider b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(20, 24, 40, 0.68); padding: 8px 12px; backdrop-filter: blur(8px); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: var(--glass); border-radius: 24px; box-shadow: 0 16px 60px var(--shadow); backdrop-filter: blur(24px); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: 0 25px 100px #0005; }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; transition: background 0.2s, border-color 0.2s; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: var(--accent); color: #141627; border-color: transparent; font-weight: 500; }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip, .stage-bar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}
/* chimera.css: what Chimera Synth adds to shell.css. */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.header, .dock-wrap { pointer-events: none; }
.header > *, .dock-wrap > * { pointer-events: auto; }
#hud, #pc-strip, .truth { pointer-events: none; }
#stage:focus { outline: none; }
#stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -8px; border-radius: 18px; }

.intro .start { pointer-events: auto; margin-top: 26px; display: inline-flex; align-items: center; gap: 9px; padding: 12px 22px 12px 17px; font-size: 13px; text-shadow: none; box-shadow: 0 10px 44px rgba(184, 183, 255, 0.28); }
.intro .start svg { width: 15px; height: 15px; fill: currentColor; stroke: none; }
body.playing .intro .start { pointer-events: none; }
.top-action#play[aria-pressed="true"] { background: var(--accent); color: #141627; border-color: transparent; }
.top-action .short { display: none; }

#pc-strip { display: flex; gap: 9px; align-items: center; justify-content: center; }
.pcdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 0.4px; color: var(--muted); min-width: 14px; }
.pcdot i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 16px) var(--accent); }

#corners { position: absolute; inset: 0; pointer-events: none; }
#corners .corner { position: absolute; pointer-events: auto; display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink); border: 1px solid var(--line); background: rgba(20, 24, 40, 0.62); backdrop-filter: blur(8px); border-radius: 999px; padding: 7px 13px 7px 9px; white-space: nowrap; }
#corners .corner span { font-size: 16px; line-height: 1; }
#corners .corner:hover { border-color: var(--accent); }
.corner.c0 { left: var(--px); top: var(--py); }
.corner.c1 { left: calc(var(--px) + var(--pw)); top: var(--py); transform: translateX(-100%); }
.corner.c2 { left: var(--px); top: calc(var(--py) + var(--ph)); transform: translateY(-100%); }
.corner.c3 { left: calc(var(--px) + var(--pw)); top: calc(var(--py) + var(--ph)); transform: translate(-100%, -100%); }
#pad-hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; font-size: 12px; color: var(--muted); letter-spacing: 0.3px; pointer-events: none; text-shadow: 0 1px 12px rgba(4, 6, 16, 0.9); }
body.playing #pad-hint { top: 62%; }

#drop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(6, 12, 22, 0.74); backdrop-filter: blur(10px); padding: 20px; }
.drop-box { text-align: center; }
.drop-targets { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
.drop-target { width: 280px; padding: 30px 22px; border: 1.5px dashed rgba(191, 194, 236, 0.35); border-radius: 22px; background: var(--glass); display: grid; gap: 8px; }
.drop-target b { font-family: var(--serif); font-size: 24px; font-weight: 400; letter-spacing: -0.3px; }
.drop-target span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.drop-target.over { border-color: var(--accent); background: var(--soft); }

.set-row b { display: block; font-size: 13px; font-weight: 500; color: var(--ink); }
.set-row > div > span { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.switch { position: relative; flex: none; width: 42px; height: 24px; padding: 0; border-radius: 999px; background: rgba(191, 194, 236, 0.16); border: 1px solid var(--line); transition: background 0.2s; }

}

<body>
<main class="scene" id="scene" aria-label="Chimera Synth">
<canvas id="stage" role="img" aria-label="A synth you breed by ear: animal voices, a playable genome and a phase-checked sub, synthesized live in your browser."></canvas>
</main>
<script>
/* gl.js: a small WebGL2 toolkit. Programs, HDR targets, bloom and the final grade. No dependencies. */
(function (global) {
  'use strict';

  const FS_VERT = `#version 300 es
out vec2 vUv;
void main(){ vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2); vUv=p; gl_Position=vec4(p*2.-1.,0.,1.); }`;

  function createGL(canvas) {
    const gl = canvas.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
    if (!gl) return null;
    const floatRT = gl.getExtension('EXT_color_buffer_float');
    const halfRT = gl.getExtension('EXT_color_buffer_half_float');
    gl.getExtension('EXT_float_blend');
    const hdr = floatRT || halfRT ? { internal: gl.RGBA16F, format: gl.RGBA, type: gl.HALF_FLOAT } : { internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE };
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.disable(gl.DEPTH_TEST);

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS) && !gl.isContextLost()) {
        const log = gl.getShaderInfoLog(s);
        throw new Error(`shader failed: ${log}`);
      }
      return s;
    }
    function program(fs, vs) {
      const p = gl.createProgram();
      gl.attachShader(p, shader(gl.VERTEX_SHADER, vs || FS_VERT));
      gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS) && !gl.isContextLost()) throw new Error(`link failed: ${gl.getProgramInfoLog(p)}`);
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const a = gl.getActiveUniform(p, i), name = a.name.replace(/\[0\]$/, '');
        u[name] = { loc: gl.getUniformLocation(p, a.name), type: a.type };
      }
      return { p, u };
    }
    function use(P, vals) {
      gl.useProgram(P.p);
      if (vals) setU(P, vals);
      return P;
    }
    function setU(P, vals) {
      for (const k in vals) {
        const u = P.u[k];
        if (!u) continue;
        const v = vals[k];
        switch (u.type) {
          case gl.FLOAT: if (typeof v === 'number') gl.uniform1f(u.loc, v); else gl.uniform1fv(u.loc, v); break;
          case gl.FLOAT_VEC2: gl.uniform2fv(u.loc, v); break;
          case gl.FLOAT_VEC3: gl.uniform3fv(u.loc, v); break;
          case gl.FLOAT_VEC4: gl.uniform4fv(u.loc, v); break;
          case gl.FLOAT_MAT3: gl.uniformMatrix3fv(u.loc, false, v); break;
          case gl.FLOAT_MAT4: gl.uniformMatrix4fv(u.loc, false, v); break;
          default: gl.uniform1i(u.loc, v);    // samplers and ints
        }
      }
    }
    function tex(w, h, fmt, opt) {
      opt = opt || {};
      const t = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, t);
      const f = fmt || hdr;
      gl.texImage2D(gl.TEXTURE_2D, 0, f.internal, w, h, 0, f.format, f.type, opt.data || null);
      const fl = opt.nearest ? gl.NEAREST : gl.LINEAR, wr = opt.repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, fl);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, fl);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wr);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wr);
      return t;
    }
    function target(w, h, fmt, opt) {
      const t = tex(w, h, fmt, opt), fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return { fbo, tex: t, w, h };
    }
    function freeTarget(T) { if (T) { gl.deleteFramebuffer(T.fbo); gl.deleteTexture(T.tex); } }
    function bindTex(unit, t) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }
    function into(T) { gl.bindFramebuffer(gl.FRAMEBUFFER, T ? T.fbo : null); gl.viewport(0, 0, T ? T.w : canvas.width, T ? T.h : canvas.height); }
    function draw() { gl.drawArrays(gl.TRIANGLES, 0, 3); }
    // A shared 256 x 256 noise texture. Half float so low-frequency hills do not stair-step.
    function noiseTexture(seed) {
      const N = 256, d = new Float32Array(N * N);
      let s = (seed || 12345) >>> 0;
      for (let i = 0; i < d.length; i++) { s = (s + 0x6d2b79f5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; d[i] = ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
      return tex(N, N, { internal: gl.R16F, format: gl.RED, type: gl.FLOAT }, { repeat: true, data: d });
    }
    return { gl, program, use, setU, tex, target, freeTarget, bindTex, into, draw, hdr, noiseTexture, FS_VERT, floatRT: !!floatRT };
  }

  const FS_HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
in vec2 vUv;
out vec4 o;
`;

  const DOWN_FS = FS_HEAD + `
uniform sampler2D uTex; uniform vec2 uPx; uniform float uThresh;
void main(){
  vec3 c=texture(uTex,vUv).rgb*4.;
  c+=texture(uTex,vUv+uPx*vec2(-1.,-1.)).rgb+texture(uTex,vUv+uPx*vec2(1.,-1.)).rgb+texture(uTex,vUv+uPx*vec2(-1.,1.)).rgb+texture(uTex,vUv+uPx*vec2(1.,1.)).rgb;
  c/=8.;
  if(uThresh>0.){ float l=max(c.r,max(c.g,c.b)); c*=smoothstep(uThresh*.55,uThresh*1.35,l); }
  o=vec4(min(c,vec3(24.)),1.);
}`;
  const UP_FS = FS_HEAD + `
uniform sampler2D uTex; uniform vec2 uPx; uniform float uK;
void main(){
  vec3 c=texture(uTex,vUv+uPx*vec2(-2.,0.)).rgb+texture(uTex,vUv+uPx*vec2(2.,0.)).rgb+texture(uTex,vUv+uPx*vec2(0.,-2.)).rgb+texture(uTex,vUv+uPx*vec2(0.,2.)).rgb;
  c+=2.*(texture(uTex,vUv+uPx*vec2(-1.,-1.)).rgb+texture(uTex,vUv+uPx*vec2(1.,-1.)).rgb+texture(uTex,vUv+uPx*vec2(-1.,1.)).rgb+texture(uTex,vUv+uPx*vec2(1.,1.)).rgb);
  o=vec4(c/12.*uK,1.);
}`;
  const GRADE_FS = FS_HEAD + `
uniform sampler2D uScene,uBloom;
uniform float uBloomK,uExposure,uFlash,uVig,uSat;
uniform vec3 uFlashC;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  vec3 c=texture(uScene,vUv).rgb+texture(uBloom,vUv).rgb*uBloomK;
  c+=uFlashC*uFlash;
  c*=uExposure;
  c=aces(c);
  float g=dot(c,vec3(.2126,.7152,.0722));
  c=mix(vec3(g),c,uSat);
  vec2 q=vUv-.5;
  c*=1.-uVig*smoothstep(.25,.95,dot(q,q)*2.1);
  o=vec4(c,1.);
}`;
  // The flicker limiter. Each region of the finished picture may change brightness only so fast, in either
  // direction, whatever made it change. Holding a 10% swing to about a quarter second keeps any large area
  // under the WCAG limit of three flashes a second, by construction. Small sparks barely move a region's mean,
  // so they stay instant.
  const LIMIT_FS = FS_HEAD + `
uniform sampler2D uCur,uPrev; uniform float uLod,uMax;
void main(){
  float cur=dot(textureLod(uCur,vUv,uLod).rgb,vec3(.2126,.7152,.0722));
  float prev=texture(uPrev,vUv).r;
  o=vec4(prev+clamp(cur-prev,-uMax,uMax),cur,0.,1.);
}`;
  const OUT_FS = FS_HEAD + `
uniform sampler2D uG,uLim; uniform float uGrain,uT; uniform vec3 uLift;
float h12(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
void main(){
  vec3 c=texture(uG,vUv).rgb;
  vec2 L=texture(uLim,vUv).rg;
  c*=clamp((L.x+.003)/(L.y+.003),.05,4.);
  c=pow(min(c,vec3(1.)),vec3(1./2.2))+uLift;
  c+=(h12(gl_FragCoord.xy+fract(uT)*97.)-.5)*uGrain;
  o=vec4(c,1.);
}`;

  // Bloom chain and final grade, shared by both pages.

  /* ---------- sheets ---------- */
  const openSheet = (name) => {
    const d = $(`${name}-sheet`);
    if (!d || d.open) return;
    document.querySelectorAll('dialog.sheet[open]').forEach((o) => o.close());
    if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
    d.focus({ preventScroll: true });
    const b = $(`${name}-button`); if (b) b.setAttribute('aria-expanded', 'true');
    global.dispatchEvent(new CustomEvent('chimera:sheet', { detail: name }));
  };
  document.querySelectorAll('dialog.sheet').forEach((d) => {
    const name = d.id.replace('-sheet', '');
    // the close event comes a moment after the sheet closes, so focus goes back to the dock only if nothing else has taken it
    d.addEventListener('close', () => { const b = $(`${name}-button`), a = document.activeElement; if (b) { b.setAttribute('aria-expanded', 'false'); if (!a || a === document.body || d.contains(a)) b.focus({ preventScroll: true }); } });
    d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
    d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => d.close()));
  });
  [...DOCK.map((d) => d.id), 'about'].forEach((name) => $(`${name}-button`).addEventListener('click', () => openSheet(name)));
  ['source-badge', 'chip-sound', 'chip-midi'].forEach((id) => $(id).addEventListener('click', () => openSheet('connect')));

  const toast = (msg, ms) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 3200); };
  const syncRange = (r) => r.style.setProperty('--val', ((+r.value - +r.min) / (+r.max - +r.min)) * 100);
  document.addEventListener('input', (e) => { if (e.target.type === 'range') syncRange(e.target); });
  const syncAllRanges = () => document.querySelectorAll('input[type="range"]').forEach(syncRange);

/* ============================== AUDIO GRAPH ============================== */
let G=null; // live graph handles

/* ---- per-VOICE Brain: FM core (or a looped audio-file oscillator) + formant bank + wub + noise.
       Returns `lp` as its lead output, which sums into the shared master sat. One instance per

function buildVoice(ac, p, spec, opts){

  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1800; lp.Q.value=4;
  voice.connect(lp);

  const lfoG=ac.createGain(); lfoG.gain.value=1200*ST.wubDepth; lfo.connect(lfoG).connect(lp.frequency);

  const nb=opts.noiseBuf||(function(){ const b=ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();

    start(time){oscs.forEach(o=>{try{o.start(time||0)}catch(e){}});},
    stop(time){oscs.forEach(o=>{try{o.stop(time)}catch(e){}});}

}

/* ---- shared MASTER: sat -> OTT (+ fizz) -> leadBus -> crush insert -> space -> out, plus the
       Body sub sine + low fundamental, the <120Hz validator taps (lowMon/lowAna) and the viz/spec
       analysers — EXACTLY as the monolithic graph. Sub/leadLow are SINGLE and anchored to the ROOT
       patch, so the phase cross-validator stays physically meaningful under polyphony. ---- */
function buildMaster(ac, dest, p, opts){

  const ott=ac.createDynamicsCompressor();

  sat.connect(ott);

  const nb=opts.noiseBuf||(function(){ const b=ac.createBuffer(1, ac.sampleRate*0.5, ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();

  const fizzG=ac.createGain(); fizzG.gain.value=ST.fizz*0.08; ns2.connect(fizzHP).connect(fizzG).connect(ott);
  const leadBus=ac.createGain(); leadBus.gain.value=0.9; ott.connect(leadBus);
  // ---- low fundamental of the patch (anchored to the ROOT patch f0) ----
  const sf=subFreq(p.f0); ST.subF=sf;
  const leadLow=ac.createOscillator(); leadLow.type="sine"; leadLow.frequency.value=sf;
  const leadLowG=ac.createGain(); leadLowG.gain.value=0.38; leadLow.connect(leadLowG);   // ~matched to default sub for a deep null
  // ---- sub (Body) with phase delay ----

  const subDelay=ac.createDelay(0.05); subDelay.delayTime.value=(ST.phase/360)/sf;

  const lowBus=ac.createGain(); leadLowG.connect(lowBus); subG.connect(lowBus);
  // ---- granular cloud bus: grains share the lead character chain (sat/OTT/crush/space) ----
  const grainBus=ac.createGain(); grainBus.gain.value=1.0; grainBus.connect(leadBus);
  // ---- bitcrush + sample-rate reduction (LEAD ONLY; inserted on toggle so the sub/validator path stays pristine & latency-free) ----
  const crush=ac.createScriptProcessor(2048,2,2);
  const cst={hold:[0,0],ph:[0,0]};
  crush.onaudioprocess=e=>{ const bits=Math.max(1,Math.min(16,ST.crushBits)), step=Math.pow(2,bits-1), ratio=Math.max(1,ST.crushDown), nc=e.inputBuffer.numberOfChannels;
    for(let c=0;c<nc;c++){ const inp=e.inputBuffer.getChannelData(c), o=e.outputBuffer.getChannelData(c); let hold=cst.hold[c]||0, ph=cst.ph[c]||0;

  const dfb=ac.createGain(); dfb.gain.value=Math.min(0.85,ST.delayFB);
  const dlp=ac.createBiquadFilter(); dlp.type="lowpass"; dlp.frequency.value=3000;
  spaceSend.connect(dly); dly.connect(dlp); dlp.connect(dfb); dfb.connect(dly); dly.connect(out);
  // ---- master (dry lead + bone-dry mono low) ----
  leadBus.connect(out); lowBus.connect(out);

  const lowMon=ac.createBiquadFilter(); lowMon.type="lowpass"; lowMon.frequency.value=120; lowMon.Q.value=0.7;

    start(time){oscs.forEach(o=>{try{o.start(time||0)}catch(e){}});},
    stop(time){oscs.forEach(o=>{try{o.stop(time)}catch(e){}});}
  };
}

/* ---- assembler: one root voice + optional detuned/transposed extra voices, summed into one master.
       At voices=1 (default / legacy single-arg call) the graph is byte-identical to the old
       monolithic buildGraph: same nodes, same params, same noise+IR RNG draw order. ---- */
function buildGraph(ac, dest, p, opts){
  opts=opts||{};
  const specs=(opts.voiceSpecs&&opts.voiceSpecs.length)?opts.voiceSpecs:[{semi:0,cents:0,pan:0}];
  const sampleBuf=opts.sampleBuf||null;
  // root voice FIRST — it draws the shared noise buffer, THEN master draws the IR (matches legacy order)
  const root=buildVoice(ac, p, specs[0], {sampleBuf});
  const master=buildMaster(ac, dest, p, {noiseBuf:root.nb});
  root.out.connect(master.satIn);                                   // root lead -> master sat (mono)
  const voices=[root];
  for(let vi=1; vi<specs.length; vi++){
    const V=buildVoice(ac, p, specs[vi], {sampleBuf});
    // extra voices: high-pass <120Hz (only the anchored ROOT feeds the low end -> the boom-null stays honest) + stereo spread
    const hp=ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=120; hp.Q.value=0.5;
    const pan=ac.createStereoPanner(); pan.pan.value=Math.max(-1,Math.min(1,V.spec.pan||0));
    V.out.connect(hp); hp.connect(pan); pan.connect(master.satIn);
    V.hp=hp; V.pan=pan; voices.push(V);
  }
  const allOscs=[]; voices.forEach(V=>{V.oscs.forEach(o=>allOscs.push(o));}); master.oscs.forEach(o=>allOscs.push(o));
  // legacy-compatible handle: promote root voice nodes to top level so all existing single-voice
  // code keeps working; G.voices is the full polyphonic list.
  const G0=Object.assign({}, master, {
    voices, voice:root.voice, carrier:root.carrier, mod:root.mod, modGain:root.modGain,
    formants:root.formants, lp:root.lp, lfo:root.lfo, lfoG:root.lfoG, nG:root.nG, oscs:allOscs,
    start(time){allOscs.forEach(o=>{try{o.start(time||0)}catch(e){}});},
    stop(time){allOscs.forEach(o=>{try{o.stop(time)}catch(e){}});}
  });
  return G0;
}
function makeIR(ac,dur,decay){ const len=Math.max(1,Math.floor(ac.sampleRate*dur)), b=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return b; }
function setCrush(on){
  if(!G) return;
  try{ G.crushIn.disconnect(G.out); }catch(e){}
  try{ G.crushIn.disconnect(G.crush); }catch(e){}
  try{ G.crush.disconnect(); }catch(e){}
  if(on){ G.crushIn.connect(G.crush); G.crush.connect(G.out); }
  else  { G.crushIn.connect(G.out); }
}
function satCurve(amt){
  const k=amt*8+0.001, n=1024, c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1; c[i]=(1+k)*x/(1+k*Math.abs(x));}
  return c;
}

/* ============================== POLYPHONY (unison + chord) ============================== */
// Extra lead voices stack under a SINGLE, root-anchored sub + phase validator. voices=1 keeps the
// mono path byte-identical to the pre-refactor engine; only lead voices are detuned/transposed.
const CHORDS={off:[0],'5th':[0,7],minor:[0,3,7],major:[0,4,7]};
function voiceSpecs(){
  const chord=CHORDS[ST.chord]||[0];
  const uni=Math.max(1,Math.min(5,ST.voices|0));
  const specs=[];
  chord.forEach(semi=>{ for(let u=0;u<uni;u++){ const spread=uni>1?(u/(uni-1))*2-1:0;
    specs.push({semi, cents:spread*ST.detune, pan:spread*ST.spread}); } });
  if(specs.length) specs[0]={semi:0,cents:0,pan:0};   // voice 0 = clean anchor (root pitch, centred)
  return specs;
}
// smooth detune/spread when the voice COUNT is unchanged; rebuild when the count changes
function retuneVoices(){
  if(!G||!AC) return;
  const specs=voiceSpecs();
  if(specs.length!==G.voices.length){ if(ST.playing) startGraph(); return; }
  const t=AC.currentTime;
  G.voices.forEach((V,i)=>{ V.spec=specs[i]; if(V.pan) V.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,V.spec.pan||0)),t,0.05); });
  applyLive();
}

/* ============================== PLAY / STOP ============================== */
function startGraph(){
  if(!ensureAudio()) return;
  if(G){stopGraph();}
  const p=morphedPatch();
  G=buildGraph(AC, OUT, p, {voiceSpecs:voiceSpecs(), sampleBuf:(ST.sampleMode==='osc'?ST.sampleBuf:null)});
  G.start(AC.currentTime);
  // amp envelope up (ADSR onset) — every polyphonic voice, scaled for stack headroom
  const t=AC.currentTime, e=ST.env, vg=1/Math.sqrt(G.voices.length);
  G.voices.forEach(V=>{ const g=V.voice.gain; g.cancelScheduledValues(t); g.setValueAtTime(0,t);
    g.linearRampToValueAtTime(vg,t+e.a); g.linearRampToValueAtTime(0.9*e.s*vg,t+e.a+e.d); });
  G.out.gain.setValueAtTime(0,t); G.out.gain.linearRampToValueAtTime(0.5,t+Math.max(0.04,e.a));
  setCrush(ST.crushOn);                 // re-apply lead crusher routing on rebuild
  ST.playing=true;
  syncPlay();
}
function stopGraph(){
  if(!G) return;
  const t=AC.currentTime, rel=Math.max(0.05,ST.env.r);   // Release knob shapes the stop
  try{G.out.gain.cancelScheduledValues(t);G.out.gain.setValueAtTime(G.out.gain.value,t);G.out.gain.linearRampToValueAtTime(0,t+rel);}catch(e){}
  const g=G; setTimeout(()=>{try{g.stop(0)}catch(e){}},rel*1000+80); G=null;
  ST.playing=false;
  syncPlay();
}
function pluck(){
  if(!ST.playing){startGraph();return;}
  const t=AC.currentTime, e=ST.env, vg=1/Math.sqrt(G.voices.length);
  G.voices.forEach(V=>{ const g=V.voice.gain; g.cancelScheduledValues(t);
    g.setValueAtTime(Math.max(0.001,g.value),t);
    g.linearRampToValueAtTime(1.5*vg, t+Math.min(0.02,e.a));           // accent attack
    g.linearRampToValueAtTime(0.9*e.s*vg, t+Math.min(0.02,e.a)+e.d); });
}

/* live param updates (no rebuild) — incl. live formant displacement so the morph is audible */
function applyLive(){
  if(!G||!AC) return; const t=AC.currentTime, gl=ST.glide, p=morphedPatch();
  // ---- per-voice Brain (each detuned/transposed instance) ----
  G.voices.forEach(V=>{
    const mult=Math.pow(2,((V.spec.semi||0)+(V.spec.cents||0)/100)/12);
    if(V.sampleSrc){ V.sampleSrc.playbackRate.setTargetAtTime(Math.pow(2,((ST.oct+ST.noteSt+(V.spec.semi||0)+(V.spec.cents||0)/100))/12),t,gl); }
    else { V.carrier.type=p.wave; V.carrier.frequency.setTargetAtTime(p.f0*mult,t,gl);
      V.mod.frequency.setTargetAtTime(p.f0*mult*p.ratio,t,gl); V.modGain.gain.setTargetAtTime(p.f0*mult*p.fm*4,t,0.04); }
    V.lfo.frequency.setTargetAtTime(ST.wubRate,t,0.05);
    V.lfoG.gain.setTargetAtTime(1200*ST.wubDepth,t,0.05);
    V.nG.gain.setTargetAtTime(p.noise*0.25,t,0.05);
    // live formant displacement (the OT morph you can hear) — same targets for every voice
    const fShift=ST.formantShift?Math.pow(2,ST.formantShift/12):1;
    for(let i=0;i<NF;i++){ const f=p.F[i], fm=V.formants[i];
      if(f){ fm.bp.frequency.setTargetAtTime(ST.formantShift?Math.max(40,Math.min(16000,f[0]*fShift)):f[0],t,gl); fm.bp.Q.setTargetAtTime(f[1],t,0.05); fm.g.gain.setTargetAtTime(f[2]*0.9,t,0.05); }
      else fm.g.gain.setTargetAtTime(0,t,0.05); }
  });
  // ---- master power stack (single) ----
  G.sat.curve=satCurve(ST.drive);
  G.ott.threshold.setTargetAtTime(-30-ST.ott*15,t,0.05); G.ott.ratio.setTargetAtTime(2+ST.ott*8,t,0.05);
  G.fizzG.gain.setTargetAtTime(ST.fizz*0.08,t,0.05);
  // ---- Body sub follows the ROOT f0 (anchored) ----
  const sf=subFreq(p.f0);
  G.sub.frequency.setTargetAtTime(sf,t,gl); G.leadLow.frequency.setTargetAtTime(sf,t,gl);
  G.subDelay.delayTime.setTargetAtTime((ST.phase/360)/sf,t,0.02);
  G.subG.gain.setTargetAtTime(ST.subLvl*0.55,t,0.05);
  // ---- space (reverb/delay) live params ----
  G.spaceSend.gain.setTargetAtTime(ST.spaceWet,t,0.05);
  G.dly.delayTime.setTargetAtTime(Math.max(0.03,ST.delayMs/1000),t,0.05);
  G.dfb.gain.setTargetAtTime(Math.min(0.85,ST.delayFB),t,0.05);
}

// In Morph mode the stage is the pad: each corner is an animal, and the puck blends all four on the log-frequency axis.

function padSet(u,v){

  if(!ST.pad){ ST.pad=true; syncPadToggle(); }

/* ============================== PHASE VALIDATOR ============================== */
function measureLowRMS(){
  if(!G||!G.lowAna) return 0;
  const a=G.lowAna, buf=new Float32Array(a.fftSize); a.getFloatTimeDomainData(buf);
  let s=0; for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  return Math.sqrt(s/buf.length);
}
async function autoAlign(){
  if(!ST.playing||!G){ if(!ensureAudio()) return; startGraph(); await new Promise(r=>setTimeout(r,350)); if(!G) return; }
  ST.autoSweep=true;
  const btn=document.getElementById('autophase'); btn.textContent="Sweeping the phase…"; btn.disabled=true;
  const sweep=[]; const N=24;
  for(let i=0;i<N;i++){
    const ph=i*360/N; const sf=ST.subF;
    G.subDelay.delayTime.setValueAtTime((ph/360)/sf, AC.currentTime);
    await new Promise(r=>setTimeout(r,45));
    let m=0; for(let k=0;k<3;k++){m+=measureLowRMS();await new Promise(r=>setTimeout(r,8));}
    sweep.push({ph,rms:m/3});
  }
  let best=sweep[0]; sweep.forEach(s=>{if(s.rms>best.rms)best=s;});
  ST.phase=Math.round(best.ph); document.getElementById('k-phase').value=ST.phase;
  document.getElementById('v-phase').textContent=ST.phase+"°"; applyLive();
  ST.sweep=sweep; ST.autoSweep=false; btn.textContent="Auto-align the sub"; btn.disabled=false;
  glitchBurst(btn.closest('.card'),1.4);   // the satisfying snap when the boom locks
  const worst=sweep.reduce((a,b)=>a.rms<b.rms?a:b);
  const gain=20*Math.log10((best.rms+1e-9)/(worst.rms+1e-9));
  document.getElementById('lowmsg').innerHTML=`Locked at <b>${ST.phase}°</b>: <b>+${gain.toFixed(1)} dB</b> of low end against the worst angle, ${Math.round(worst.ph)}°, where it nearly cancels.`;
}

// size a canvas's backing store to its box and the screen's pixel ratio, and draw in CSS pixels
function fitCanvas(c){
  const dpr=Math.min(2,devicePixelRatio||1), w=Math.max(1,Math.round(c.clientWidth)), h=Math.max(1,Math.round(c.clientHeight));
  if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){ c.width=Math.round(w*dpr); c.height=Math.round(h*dpr); }
  const x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); return {x,w,h};
}
function drawWheel(){
  const c=document.getElementById('wheel'); if(!c||!c.clientWidth) return;
  const {x,w,h}=fitCanvas(c), cx=w/2, cy=h/2, R=Math.min(w,h)/2-18;
  x.clearRect(0,0,w,h);
  x.strokeStyle=themeColor('--line'); x.lineWidth=1; x.beginPath(); x.arc(cx,cy,R,0,7); x.stroke();
  if(ST.sweep){                         // the last sweep, as a polar plot of measured low-end level
    const mx=Math.max(...ST.sweep.map(s=>s.rms))||1e-9;
    x.beginPath();
    ST.sweep.forEach((s,i)=>{const ang=s.ph*Math.PI/180-Math.PI/2; const r=R*0.14+(s.rms/mx)*R*0.84;
      const px=cx+Math.cos(ang)*r, py=cy+Math.sin(ang)*r; i?x.lineTo(px,py):x.moveTo(px,py);});
    x.closePath(); x.fillStyle=themeColor('--cyan'); x.globalAlpha=.16; x.fill(); x.globalAlpha=1; x.strokeStyle=themeColor('--cyan'); x.stroke();
  }
  // the needle's color comes from the MEASURED reinforce or cancel value, never from the angle
  const ang=ST.phase*Math.PI/180-Math.PI/2;
  x.strokeStyle = !ST.monoValid ? themeColor('--dim') : (ST.mono>0.1?themeColor('--green'):(ST.mono<-0.1?themeColor('--red'):themeColor('--amber'))); x.lineWidth=3; x.lineCap='round';
  x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.cos(ang)*R, cy+Math.sin(ang)*R); x.stroke();
  x.fillStyle=themeColor('--dim'); x.font="11px ui-sans-serif,-apple-system,sans-serif"; x.textAlign="center";
  x.fillText("0°",cx,cy-R-6); x.fillText("180°",cx,cy+R+14);
}

/* ============================== LOW-END MEASUREMENT ============================== */
// The low bus is leadLow + phase-delayed sub, both pure sines at sf. Their summed RMS is
// exactly sqrt((aL^2 + aS^2 + 2*aL*aS*cos phi)/2): max at phi=0, min at phi=180. We normalise
// the MEASURED <120Hz RMS against that analytic min/max -> a real reinforcing/cancelling value.
function monoFromRms(rms,aL,aS){
  const rmsMax=(aL+aS)/Math.SQRT2, rmsMin=Math.abs(aL-aS)/Math.SQRT2;
  if(!(aS>0.02 && (rmsMax-rmsMin)>1e-4)) return null;
  return Math.max(-1,Math.min(1, 2*(rms-rmsMin)/(rmsMax-rmsMin)-1));
}
function measureTick(){
  if(G&&ST.playing){
    const rms=measureLowRMS(); ST.lowRMS=rms;
    ST.lowDb=20*Math.log10(rms+1e-9);
    const monoM=monoFromRms(rms,G.leadLowG.gain.value,G.subG.gain.value);
    ST.mono = monoM==null?0:monoM; ST.monoValid = monoM!=null;
  }else{ ST.lowRMS=0; ST.lowDb=-120; ST.mono=0; ST.monoValid=false; }
}
function lowWord(){ return !ST.monoValid?(ST.playing?"raise the sub to test":"not measured"):(ST.mono>0.1?"reinforcing ✓":(ST.mono<-0.1?"cancelling ✕":"partial")); }
function renderLowEnd(){               // the Signal sheet's meter, while it is open
  const fill=document.getElementById('lowfill'), lowdb=document.getElementById('lowdb'), monoc=document.getElementById('monoc');
  const live=G&&ST.playing&&ST.lowDb>-59;

  const col=!ST.monoValid?"var(--warn)":(ST.mono>0.1?"var(--good)":(ST.mono<-0.1?"var(--bad)":"var(--warn)"));
  fill.style.background=col;
  lowdb.textContent=live?ST.lowDb.toFixed(1)+" dB":"silent";
  monoc.textContent=lowWord();
}

function curate(text){
  text=text.toLowerCase();
  let best=null, bestN=0;
  VIBEMAP.forEach(m=>{const n=m.kw.filter(k=>text.includes(k)).length; if(n>bestN){bestN=n;best=m;}});

async function exportWav(){
  const btn=document.getElementById('export'), cap=btn.querySelector('.cap')||btn; cap.textContent="Rendering…"; btn.disabled=true;
  try{
  const dur=4, sr=44100;
  const oc=new OfflineAudioContext(2, sr*dur, sr);
  const p=morphedPatch();
  const g=buildGraph(oc, oc.destination, p, {voiceSpecs:voiceSpecs(), sampleBuf:(ST.sampleMode==='osc'?ST.sampleBuf:null)});
  const e=ST.env, vg=1/Math.sqrt(g.voices.length);
  // A/D/S shape each lead voice; the Release fades the MASTER so the sub releases too
  g.voices.forEach(V=>{ const gg=V.voice.gain; gg.setValueAtTime(0,0);
    gg.linearRampToValueAtTime(vg, e.a); gg.linearRampToValueAtTime(0.9*e.s*vg, e.a+e.d); });
  g.out.gain.setValueAtTime(0,0); g.out.gain.linearRampToValueAtTime(0.5,0.06);
  g.out.gain.setValueAtTime(0.5, Math.max(0.1, dur-e.r));
  g.out.gain.linearRampToValueAtTime(0.0, dur-0.005);
  g.start(0); g.stop(dur);
  const rendered=await oc.startRendering();
  const wav=encodeWav(rendered);
  dlBlob(new Blob([wav],{type:'audio/wav'}), ST.genomeMode?`chimera_garden-seed${LINEAGE.cur}.wav`:`chimera_${ANIMALS[ST.A].key}-x-${ANIMALS[ST.B].key}_t${Math.round(ST.t*100)}.wav`);
  toast('Rendered 4 seconds to a WAV file.');
  }catch(err){ toast('The render failed: '+err.message); }
  finally{ cap.textContent="Render 4 seconds"; btn.disabled=false; }
}
function encodeWav(buf){
  const nch=buf.numberOfChannels, len=buf.length, sr=buf.sampleRate;
  const ab=new ArrayBuffer(44+len*nch*2), dv=new DataView(ab);
  const wr=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  wr(0,"RIFF"); dv.setUint32(4,36+len*nch*2,true); wr(8,"WAVE"); wr(12,"fmt ");

/* ============================== GENOME / SEED GARDEN ==============================
   Synplant-style genetic layer, evolved in place on the BioBass engine. A genome is a
   ~20-gene vector in [0,1] that decodes to a synth patch + macro params driving the SAME
   buildVoice/buildMaster graph. You play by BREEDING: a central seed, radial mutations,
   drag to evolve toward one by ear. Genopatch grows a seed from a dropped sample by
   Differential Evolution against its spectrum — a transparent local analysis-by-synthesis
   APPROXIMATION of the sample's spectral character, seeded by DSP heuristics. No learned
   or neural model. The genome stores extracted params only, never audio.               */

const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;

// ~20 genes. Frequency/time genes are log-warped so a fixed nudge is perceptually even.
// Patch genes (pitch..noise) are explored by the garden; macro genes (wubRate..space)
// are also editable by the knob rack (which becomes this seed's DNA editor).
const GENES = [
  {name:'pitch',     min:40,    max:600,  warp:'log', group:'osc'},
  {name:'wave',      min:0,     max:1,    warp:'lin', group:'osc'},
  {name:'modRatio',  min:0.25,  max:4,    warp:'log', group:'fm'},
  {name:'fmDepth',   min:0,     max:1,    warp:'lin', group:'fm'},
  {name:'noise',     min:0,     max:0.8,  warp:'lin', group:'noise'},
  {name:'formShift', min:0.5,   max:2.0,  warp:'log', group:'formant'},
  {name:'formSpread',min:0.6,   max:1.6,  warp:'lin', group:'formant'},
  {name:'formTilt',  min:-1,    max:1,    warp:'lin', group:'formant'},
  {name:'formQ',     min:0.5,   max:2.0,  warp:'lin', group:'formant'},
  {name:'wubRate',   min:0.1,   max:12,   warp:'log', group:'move'},
  {name:'wubDepth',  min:0,     max:1,    warp:'lin', group:'move'},
  {name:'attack',    min:0.002, max:0.5,  warp:'log', group:'env'},
  {name:'decay',     min:0.02,  max:1.0,  warp:'log', group:'env'},
  {name:'sustain',   min:0,     max:1,    warp:'lin', group:'env'},
  {name:'release',   min:0.02,  max:1.5,  warp:'log', group:'env'},
  {name:'subLevel',  min:0,     max:1,    warp:'lin', group:'body'},
  {name:'drive',     min:0,     max:1,    warp:'lin', group:'fx'},
  {name:'ott',       min:0,     max:1,    warp:'lin', group:'fx'},
  {name:'fizz',      min:0,     max:0.5,  warp:'lin', group:'fx'},
  {name:'space',     min:0,     max:0.7,  warp:'lin', group:'fx'},

const GN = GENES.length;
const GIDX = Object.fromEntries(GENES.map((g,i)=>[g.name,i]));

// pure, round-trip-verified encode/decode (the linchpin — every operator acts on [0,1]^N)
function geneDecode(g){
  const p = {};
  for(let i=0;i<GN;i++){ const G=GENES[i], u=clamp01(g[i]);
    p[G.name] = G.warp==='log' ? G.min*Math.pow(G.max/G.min,u) : G.min+(G.max-G.min)*u; }
  return p;
}
function geneEncode(params){
  const g = new Float32Array(GN);
  for(let i=0;i<GN;i++){ const G=GENES[i], v=params[G.name];
    g[i] = clamp01(G.warp==='log' ? Math.log(v/G.min)/Math.log(G.max/G.min)
                                  : (v-G.min)/(G.max-G.min)); }
  return g;
}

const WAVES = ['sine','triangle','sawtooth','square'];
const FORMANT_BASE = [[600,7,1.0],[1400,8,0.6],[2600,9,0.3]];  // neutral vocal bank

// genome -> BioBass patch (same shape blendAnimals returns)
function genomeToPatch(g){
  const d = geneDecode(g);
  const wave = WAVES[Math.min(3, Math.floor(d.wave*3.999))];
  const F = FORMANT_BASE.map((f,i)=>{
    const freq = f[0]*d.formShift*Math.pow(d.formSpread, i);       // shift whole bank + widen spacing
    const q    = f[1]*d.formQ;
    const amp  = Math.max(0.04, Math.min(1.2, f[2]*Math.pow(10, d.formTilt*(i-1)*0.4))); // tilt across bank
    return [freq, q, amp];
  });
  const f0 = d.pitch*Math.pow(2, (ST.oct+ST.noteSt)/12);
  return { f0, wave, ratio:d.modRatio, fm:d.fmDepth, noise:d.noise, hue:200, F, wd:0, _d:d };
}

// push a genome's macro genes into ST so applyLive/buildMaster reflect them
function applyGenomeToST(g){

  ST.env = {a:d.attack, d:d.decay, s:d.sustain, r:d.release};
  ST.subLvl = d.subLevel; ST.drive = d.drive; ST.ott = d.ott; ST.fizz = d.fizz;
  ST.spaceWet = d.space;
}

// the single live entry point: set the genome and hear it
let GENOME = null, SEED = null, _lastGlide = 0.05;
function setGenome(g, opts){
  opts = opts || {};

  if(ST.genomeMode){
    applyGenomeToST(GENOME);
    if(opts.glide!=null){ _lastGlide = ST.glide; ST.glide = opts.glide; }
    if(G && AC) applyLive();
    if(opts.glide!=null) ST.glide = _lastGlide;

/* ---- the garden: a seed + 12 radial mutation branches you evolve toward by ear ---- */
const GARDEN = { seed:null, branches:[], amount:0.6, temp:0.35, drag:null,
                 grow:false, growPhase:0, hover:-1, undo:[] };
const NBRANCH = 12;

function mul32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function regenBranches(){
  const r = mul32((ST.seed|0) ^ 0x9E37 ^ Math.floor(GARDEN.temp*1000));
  GARDEN.branches = [];
  for(let b=0;b<NBRANCH;b++){
    const mut = new Float32Array(GN);
    for(let i=0;i<GN;i++){
      // gaussian-ish nudge (sum of uniforms), scaled by temperature; per-branch stable
      const n = (r()+r()+r()-1.5)/1.5;
      mut[i] = clamp01(GARDEN.seed[i] + n*GARDEN.temp);
    }
    GARDEN.branches.push({g:mut, ang:(b/NBRANCH)*Math.PI*2 - Math.PI/2});
  }
}
const LINEAGE={nodes:[],cur:-1};
function lineageAdd(genome){
  const node={id:LINEAGE.nodes.length,g:Float32Array.from(genome),
              parent:LINEAGE.cur,depth:LINEAGE.cur<0?0:LINEAGE.nodes[LINEAGE.cur].depth+1,kids:0};
  if(LINEAGE.cur>=0)LINEAGE.nodes[LINEAGE.cur].kids++;
  LINEAGE.nodes.push(node); LINEAGE.cur=node.id;

}
function lineageJump(id){
  if(id<0||id>=LINEAGE.nodes.length)return;
  LINEAGE.cur=id;
  GARDEN.seed=Float32Array.from(LINEAGE.nodes[id].g); SEED=GARDEN.seed;
  regenBranches(); setGenome(GARDEN.seed,{glide:0.05}); drawLineage();
  toast('Back to seed '+id+'. New growth forks from here.');
}
function drawLineage(){
  const cv=document.getElementById('lineage'); if(!cv||!cv.clientWidth)return;
  const {x:c,w:W,h:H}=fitCanvas(cv);
  c.clearRect(0,0,W,H);
  const n=LINEAGE.nodes.length; if(!n)return;
  const maxD=Math.max(...LINEAGE.nodes.map(o=>o.depth));
  const lanes=[], count=[];              // per-depth slot counters; each generation's seeds sit centered in its column
  LINEAGE.nodes.forEach(o=>{ count[o.depth]=(count[o.depth]||0)+1; });
  LINEAGE._px=[];
  LINEAGE.nodes.forEach(o=>{
    lanes[o.depth]=(lanes[o.depth]||0);
    const x=maxD?22+o.depth/maxD*(W-44):W/2, n=Math.min(6,count[o.depth]), step=Math.min(22,(H-28)/Math.max(1,n-1));
    const y=H/2+((lanes[o.depth]%6)-(n-1)/2)*step;
    lanes[o.depth]++;

  });
  c.strokeStyle='rgba(191,194,236,.32)'; c.lineWidth=1;
  LINEAGE.nodes.forEach(o=>{ if(o.parent>=0){ const p=LINEAGE.nodes[o.parent];
    c.beginPath(); c.moveTo(p._x,p._y); c.lineTo(o._x,o._y); c.stroke(); }});

    const hue=genomeHue(o.g);
    c.beginPath(); c.arc(o._x,o._y,o.id===LINEAGE.cur?6:3.6,0,6.283);
    c.fillStyle=`hsl(${hue|0} 70% ${o.id===LINEAGE.cur?72:56}%)`; c.fill();

// a genome's fingerprint hue, shared by the buds, the seed, the lineage and the stage
// a genome's fingerprint color, shared by the buds, the seed, the lineage and the stage. It reads the formant, pitch and FM
// genes and stays inside the suite's teal to rose range, so neighbors differ visibly. A label, not a measurement.
function genomeHue(g){ const u=(0.15+1.3*g[GIDX.formShift]+0.7*g[GIDX.pitch]+0.5*g[GIDX.fmDepth])%1; return 186+u*174; }
function plantSeed(g, pushUndo){

  if(GARDEN.undo.length>40) GARDEN.undo.shift();

  SEED = GARDEN.seed;
  regenBranches();

}
function undoSeed(){
  if(!GARDEN.undo.length) { toast('Nothing to undo.'); return; }

  regenBranches(); setGenome(GARDEN.seed, {glide:0.05});

/* ---- the garden lives on the stage: chimera.js draws it and keeps this geometry, in CSS pixels ---- */
const GARDEN_GEOM={cx:0,cy:0,R:1};
function gardenGeom(){ return GARDEN_GEOM; }
function drawGarden(){ GARDEN.dirty=true; }      // the stage redraws every frame
function _branchAt(mx,my){
  const {cx,cy,R} = gardenGeom();
  const dx=mx-cx, dy=my-cy, dist=Math.hypot(dx,dy);
  if(dist < Math.max(14,R*0.1)) return {branch:-1, r:0};      // on the seed core
  const ang = Math.atan2(dy,dx);
  let best=0, bd=1e9;
  for(let b=0;b<GARDEN.branches.length;b++){
    let da = Math.abs(((GARDEN.branches[b].ang - ang + Math.PI*3)%(Math.PI*2)) - Math.PI);
    if(da<bd){bd=da; best=b;}
  }
  return {branch:best, r:Math.min(1.15, dist/R)};
}
function gardenPointer(mx,my,kind){
  if(!GARDEN.seed) return;
  const hit = _branchAt(mx,my);
  if(kind==='move' && !GARDEN.drag){ GARDEN.hover = hit.branch; return; }
  gardenApply(hit, kind);
}
// one step of breeding: lean from the seed toward a bud by reach, and on release grow a seed there
function gardenApply(hit, kind){
  if(hit.branch<0){                                  // released on the core: cancel back to the seed
    if(kind==='up' && GARDEN.drag){ GARDEN.drag=null; setGenome(GARDEN.seed,{glide:0.05}); }
    return; }
  const br = GARDEN.branches[hit.branch];
  const reach = Math.min(1, hit.r) * GARDEN.amount;
  const cur = new Float32Array(GN);
  for(let i=0;i<GN;i++) cur[i] = clamp01(GARDEN.seed[i] + (br.g[i]-GARDEN.seed[i])*reach);
  if(kind==='down'){ GARDEN.drag = {branch:hit.branch, r:hit.r}; ensureLiveGenome(); setGenome(cur,{glide:0.03}); }
  else if(kind==='move'){ GARDEN.drag = {branch:hit.branch, r:hit.r}; setGenome(cur,{glide:0.03}); }
  else if(kind==='up'){
    plantSeed(cur, true); GARDEN.drag=null; GARDEN.hover=-1;      // commit where you let go as the new seed
    toast('Grew a new seed here. Keep breeding, or press ⌘Z or Ctrl+Z to step back.');
  }
}
function growTick(){
  if(GARDEN.grow && GARDEN.seed && GARDEN.branches.length){
    GARDEN.growPhase += 0.008;
    const b = Math.floor(GARDEN.growPhase) % GARDEN.branches.length;
    const f = 0.5 - 0.5*Math.cos((GARDEN.growPhase%1)*Math.PI*2);
    const br = GARDEN.branches[b];
    const cur = new Float32Array(GN);
    for(let i=0;i<GN;i++) cur[i] = clamp01(GARDEN.seed[i] + (br.g[i]-GARDEN.seed[i])*f*GARDEN.amount);
    setGenome(cur,{glide:0.05});
  }
  requestAnimationFrame(growTick);
}

function ensureLiveGenome(){
  if(!ST.genomeMode) enterGenomeMode(true);
  if(!ST.playing) startGraph();
}

function enterGenomeMode(on){

  const tog = document.getElementById('genome-toggle');

  if(tog){ tog.classList.toggle('on', on); tog.textContent = on ? '🌱 genome mode: ON' : '🌱 genome mode: off'; }
  if(on){
    if(!GARDEN.seed) plantSeed(defaultSeedGenome(), false);
    else setGenome(GARDEN.seed, {glide:0.05});

function defaultSeedGenome(){
  // a musical starting point: mid bass, saw-ish, gentle formants, slow wub
  return geneEncode({ pitch:110, wave:0.66, modRatio:1.0, fmDepth:0.35, noise:0.15,
    formShift:1.0, formSpread:1.0, formTilt:0.0, formQ:1.0, wubRate:3.2, wubDepth:0.5,
    attack:0.02, decay:0.2, sustain:0.8, release:0.25, subLevel:0.7, drive:0.35,
    ott:0.4, fizz:0.2, space:0.0 });

/* ---- GENOPATCH: grow a seed from a dropped sample via Differential Evolution ---- */
function _sampleSpectrum(ch, sr){
  // averaged log-magnitude over 200..8000 Hz, L2-normalized (the fitness target)
  const N=2048, re=new Float64Array(N), im=new Float64Array(N), mag=new Float64Array(N/2);
  let frames=0;
  for(let o=0;o+N<=ch.length && frames<20;o+=Math.floor(N*0.75)){
    for(let i=0;i<N;i++){ const wnd=0.5-0.5*Math.cos(2*Math.PI*i/(N-1)); re[i]=ch[o+i]*wnd; im[i]=0; }
    _fft(re,im); for(let i=0;i<N/2;i++) mag[i]+=Math.hypot(re[i],im[i]); frames++;
  }
  const binHz=sr/N, lo=Math.max(1,Math.floor(200/binHz)), hi=Math.min(N/2-1,Math.floor(8000/binHz));
  const v=[]; for(let i=lo;i<hi;i++) v.push(Math.log(1+mag[i]));
  const norm=Math.hypot(...v)||1; return {v:v.map(x=>x/norm), lo, hi, binHz, N};
}
async function _renderGenomeSpectrum(g, ref){
  const sr = AC ? AC.sampleRate : 44100, dur=0.30;
  const oc = new OfflineAudioContext(1, Math.floor(sr*dur), sr);
  const p = genomeToPatch(g);
  const gr = buildGraph(oc, oc.destination, p, {voiceSpecs:[{semi:0,cents:0,pan:0}]});
  gr.voices.forEach(V=>V.voice.gain.setValueAtTime(0.9,0)); gr.out.gain.setValueAtTime(0.5,0);

async function genopatchGrow(buf){

  const st=document.getElementById('gp-status'); const bar=document.getElementById('gp-bar'); const cancelBtn=document.getElementById('gp-cancel');
  if(cancelBtn) cancelBtn.hidden=false;

  try{
    enterGenomeMode(true);

    const seed=analyzeSampleToGenome(buf);

      pop.push(c); }

      if(_deCancel) break;
      fit[k]=_specDist(await _renderGenomeSpectrum(pop[k],ref), ref.v);
      if(k%4===0){ setS(`Seeding the population, ${k+1} of ${POP}…`); await new Promise(z=>setTimeout(z,0)); } }

      plantSeed(seed, true);

      return;
    }

    for(let gen=0; gen<GENS; gen++){

      for(let k=0;k<POP;k++){

        let a,b,c; do{a=(r()*POP)|0;}while(a===k); do{b=(r()*POP)|0;}while(b===k||b===a); do{c=(r()*POP)|0;}while(c===k||c===a||c===b);

        const tf=_specDist(await _renderGenomeSpectrum(trial,ref), ref.v);

      }

      setS(`Growing, generation ${gen+1} of ${GENS} · best fit ${fit[best].toFixed(3)}`);

    } else {

      if(bar) bar.style.width='100%';

}

  }

  /* ---------------- flicker check hook ---------------- */
  // record the picture's brightness on a small grid, every frame, straight after it is drawn
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames2 = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(glOK ? cv : ov, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames2.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames2); }
      };
    });
  }

  /* ---------------- boot ---------------- */
  UI.toast.t = 0;
  addEventListener('chimera:sheet', (e) => {          // drawn the moment a sheet opens, so no canvas is ever shown at the wrong size
    const d = e.detail;
    if (d === 'garden') drawLineage();
    if (d === 'voices') { window.drawGlyphs(); drawMorphViz(); }
    if (d === 'rack') { drawEnvViz(); drawChain(); }
    if (d === 'signal') { drawWheel(); drawSpec(); }
    renderStates();
  });
  addEventListener('resize', resize);
  addEventListener('hashchange', () => { if (location.hash.startsWith('#p=')) { if(loadFromHash()) UI.toast(patchLoadMessage()); else UI.toast('That link does not contain a valid Chimera patch.'); } });   // a pasted link in an open tab
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  G2 = createGL(cv);
  if (G2 && (G2.floatRT || G2.gl.getExtension('EXT_color_buffer_half_float'))) {
    try {
      gl = G2.gl; Post = createPost(G2);
      pBg = G2.program(BG_FS); pComp = G2.program(COMP_FS);
      tN = G2.noiseTexture(20261102);
      tOv = G2.tex(4, 4, { internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE });
      tField = G2.tex(24, 24, { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE });
      glOK = true;
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); glOK = false; UI.toast('The graphics context was lost. Reload the page to get the picture back.', 8000); });
    } catch (e) { console.error(e); glOK = false; }
  }
  if (!glOK) {                           // a plain picture without glow, so the instrument still works
    ov.id = 'stage-2d'; ov.setAttribute('role', 'img'); ov.setAttribute('aria-label', cv.getAttribute('aria-label') || 'Stage');
    cv.replaceWith(ov); ov.id = 'stage';
  }
  const stageEl = $('stage');
  stageEl.tabIndex = 0;
  stageEl.setAttribute('aria-roledescription', 'instrument');
  stageEl.setAttribute('aria-keyshortcuts', 'ArrowLeft ArrowRight ArrowUp ArrowDown Enter Escape');
  stageEl.setAttribute('aria-describedby', 'stage-help');
  $('scene').insertAdjacentHTML('beforeend', '<p id="stage-help" class="sr-only">In Garden, left and right arrows choose a bud, up and down lean toward it, Enter grows a seed there and Escape cancels. In Morph, the arrows move the puck. Letter keys play notes.</p>');
  setMode(PATCH_LOADED_MODE || (store.get('mode', 'garden') === 'morph' ? 'morph' : 'garden'));
  renderCorners();
  resize();
  requestAnimationFrame(render);

  window.__app = {
    ST, GARDEN, ANIMALS, LINEAGE, midi, setMode, decodeFile, handleFile, recordLuma,
    get mode() { return mode; }, get demoOn() { return !!demo; }, get glOK() { return glOK; },
    get lastDownload() { return LAST_DOWNLOAD; }, get sound() { return AC ? AC.state : 'off'; },
    kit: { feedMidi: onMidiMessage },
  };
})();

</script>
</body>
