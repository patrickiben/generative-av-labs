name: Browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Built pages match src
        run: |
          python3 build.py
          git diff --exit-code -- nebula.html enter.html chimera.html analog.html displacer.html index.html field-guide.html
      - name: Analog matches the desktop app number for number
        run: |
          pip install numpy scipy
          python3 tests/analog_numbers.py
      - name: Guarded synthesis and mixed-rate audio integrity
        run: |
          node tests/analog_forge.js
          node tests/displacer_resampling.js
      - name: Session imports and concurrent audio/depth requests
        run: |
          node tests/session_integrity.js
          node tests/displacer_async.js
          node tests/enter_depth_requests.js
          node tests/media_import_order.js
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/smoke.py
