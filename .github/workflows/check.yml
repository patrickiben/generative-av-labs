name: Browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Built pages match src
        run: |
          python3 build.py
          git diff --exit-code -- nebula.html endless-cockpit.html enter.html chimera.html displacer.html index.html field-guide.html
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/smoke.py
