<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Displacer</title>
<meta name="description" content="Blend two sounds by optimal transport: the energy moves along frequency instead of two recordings playing at once.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23b8b7ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23b8b7ff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: var(--sans);   /* headings use the interface sans-serif, as on Body Signal Labs */
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 540px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.5) 0%, transparent 18%, transparent 58%, rgba(5, 8, 18, 0.72) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }

.header { position: absolute; left: 42px; right: 42px; top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(12px); transition: background 0.25s; }
.top-action:hover { background: var(--soft); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.35s, color 0.35s; }
.mode-switch button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 10px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); padding: 4px 7px; border-radius: 10px; border: 1px solid transparent; transition: background 0.18s, border-color 0.18s, color 0.18s; }
.hitdot:hover { background: var(--soft); border-color: var(--line); color: var(--ink); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }
.stage-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); box-shadow: 0 8px 30px var(--shadow); }
.stage-bar .pill { padding: 6px 13px; font-size: 11px; }
.stage-bar .stage-slider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.stage-bar .stage-slider input[type="range"] { width: clamp(120px, 18vw, 200px); }
.stage-bar .stage-slider b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(20, 24, 40, 0.68); padding: 8px 12px; backdrop-filter: blur(8px); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: var(--glass); border-radius: 24px; box-shadow: 0 16px 60px var(--shadow); backdrop-filter: blur(24px); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: 0 25px 100px #0005; }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; transition: background 0.2s, border-color 0.2s; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: var(--accent); color: #141627; border-color: transparent; font-weight: 500; }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip, .stage-bar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}

/* Displacer: what the blender adds to the shared shell. */
#method-badge { position: absolute; top: max(84px, calc(env(safe-area-inset-top) + 70px)); left: 50%; transform: translateX(-50%); width: max-content; max-width: min(760px, calc(100% - 32px)); padding: 7px 14px 7px 28px; border: 1px solid rgba(184, 183, 255, 0.28); border-radius: 12px; background: rgba(20, 22, 38, 0.66); backdrop-filter: blur(12px); color: #dcdbfa; font: 500 10px/1.5 var(--mono); letter-spacing: 0.5px; text-transform: uppercase; text-align: center; pointer-events: none; }
#method-badge::before { content: ""; position: absolute; left: 12px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px #b8b7ff88; }
#method-badge[data-kind$="xfade"] { border-color: rgba(241, 207, 142, 0.34); color: #f0dcb4; }
#method-badge[data-kind$="xfade"]::before { background: var(--warn); box-shadow: 0 0 10px #f1cf8e88; }
#busy { position: absolute; top: max(120px, calc(env(safe-area-inset-top) + 106px)); left: 50%; transform: translateX(-50%); padding: 6px 12px 6px 24px; border-radius: 999px; font-size: 11px; color: var(--ink); background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(10px); white-space: nowrap; pointer-events: none; }
#busy::before { content: ""; position: absolute; left: 10px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
body.moved .intro { opacity: 0; transform: translateY(-10px); }

/* A sound image should read as sound, with the same axes as the rendered spectrum. */
#spectrogram-guide { position: absolute; pointer-events: none; border: 1px solid rgba(184,183,255,.17); border-radius: 3px; color: #bcbdd2; font: 10px/1.4 var(--mono); }
.spec-heading { position: absolute; left: 0; bottom: calc(100% + 16px); display: grid; gap: 5px; max-width: 100%; }
.spec-heading > span { color: #8be0d4; letter-spacing: 1.8px; font-size: 10px; }
.spec-heading strong { color: #eeedfb; font: 400 clamp(14px, 1.5vw, 21px)/1.3 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#spec-frequencies span { position: absolute; right: calc(100% + 10px); transform: translateY(50%); white-space: nowrap; }
#spec-frequencies span::after { content: ''; position: absolute; left: calc(100% + 4px); top: 50%; width: 6px; border-top: 1px solid #777993; }
#spec-times span { position: absolute; top: calc(100% + 8px); transform: translateX(-50%); white-space: nowrap; }
.spec-key { position: absolute; top: calc(100% + 29px); left: 50%; transform: translateX(-50%); white-space: nowrap; color: #8b8da6; }
body:not(.moved) #spectrogram-guide .spec-heading { opacity: 0; }
body.performance #spectrogram-guide { display: none; }

/* the A to B bar is the instrument */
.ab { display: flex; align-items: center; justify-content: center; gap: 14px; max-width: min(980px, 100%); }
.ab-thumb { position: relative; width: 88px; height: 55px; flex: none; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: #0c1020; box-shadow: 0 8px 30px var(--shadow); transition: border-color 0.2s, transform 0.2s; }
.ab-thumb canvas { width: 100%; height: 100%; display: block; }
.ab-thumb:hover { border-color: #86e0d3; transform: translateY(-1px); }

<script>

    ekit: {
      name: 'E-kit starting map',
      notes: { kick: [36], snare: [38, 40, 37, 23], hat: [42, 22, 44, 46], tomH: [48, 50], tomM: [45, 47], tomL: [43, 41], crash: [49, 57, 52, 55], ride: [51, 53, 59] },
    },
    gm: {
      name: 'General MIDI',
      notes: { kick: [35, 36], snare: [38, 40, 37, 39], hat: [42, 44, 46], tomH: [48, 50], tomM: [45, 47], tomL: [41, 43], crash: [49, 57, 52, 55], ride: [51, 53, 59] },
    },
  };
  const SOFT_NOTES = { 23: 0.55 };              // a brush sweep note reads as a soft snare
  const TAU = { kick: 0.15, snare: 0.11, hat: 0.06, tom: 0.18, crash: 0.95, ride: 0.3, flash: 0.09 };

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

    get(k, d) { try { const v = localStorage.getItem('drv.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

  /* ------------------------------------------------- pure math, testable from the page */

  // Which drum does a hit look like, from peak levels in four bands (dB)? A stated heuristic, not a model.
  function classify(L, M1, M2, H) {
    if (H >= M2 - 1 && H - Math.max(L, M1) > 8) return 'hat';
    if (L - M2 > 10 && L - M1 > -1.5) return 'kick';

  // Tempo from hit times: a weighted histogram of intervals, folded by octaves into 70 to 180 BPM.
  function estimateTempo(times, weights) {
    const n = times.length;
    if (n < 4) return { bpm: null, conf: 0 };
    const lo = 70, hi = 180, bins = new Float64Array(hi - lo + 2);
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const dt = times[j] - times[i];
        if (dt > 2.2) break;
        if (dt < 0.09) continue;

        while (b > hi) b /= 2;
        while (b < lo) b *= 2;

  function analyzeSession(sess) {
    const hits = (sess && sess.hits) || [];
    const per = {};

  }

  function bandFreq(i) { return FMIN * Math.pow(FMAX / FMIN, (i + 0.5) / BANDS); }

  // Check the complete import before it can replace live input or reach the animation loop.
  function validateSession(s) {
    const invalid = () => { throw new Error('This session is incomplete or has invalid events. Open an unedited session saved by Nebula.'); };
    const number = (v, lo, hi = Infinity) => Number.isFinite(v) && v >= lo && v <= hi;
    if (!s || !/\/session@1$/.test(s.schema || '') || !number(s.durationMs, 0) ||
        !Array.isArray(s.hits) || !Array.isArray(s.ctrl) ||
        (s.bands != null && s.bands !== BANDS) ||

    kick: mix2(bump(70, 0.9, 1), bump(3000, 1.2, 0.18)),
    snare: mix2(bump(220, 0.7, 0.7), bump(2500, 2.2, 0.85)),

  /* ------------------------------------------------- onset detection inside the audio thread */

  const WORKLET_SRC = `
${classify.toString()}

  process(inputs){const inp=inputs[0];if(!inp||!inp.length||!inp[0]){this.tickSilent();return true}
    const L=inp[0],R=inp[1]||L;this.ch=inp.length;const f=this.f,d=this.dec,e=this.env;

  /* ------------------------------------------------- the kit */

  function createKit() {
    const listeners = {};
    const on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); return kit; };

        if (s % 2 === 0 || s > 13) fire(s < 11 ? 'tomH' : s < 14 ? 'tomM' : 'tomL', 0.8 + (s % 3) * 0.06);

      }
      const kicks = [[0, 6, 8], [0, 3, 8, 11], [0, 8, 10]][sec], snares = [4, 12];
      if (kicks.includes(s)) fire('kick', s === 0 ? 1 : 0.82);
      if (snares.includes(s)) fire('snare', 0.92);

      if (sec === 1 && s % 2 === 0) fire('ride', s % 4 === 0 ? 0.74 : 0.5);

    }
    function demoLoop() {
      const D = demo;
      if (!D) return;
      D.timers = D.timers.filter((t) => t !== null).slice(-64);

      const stepsPerBar = style === 'polymeter' ? 14 : 16;

    };

      if (!replay) return;

      if (!analyser || !(stream || demo)) { for (let i = 0; i < BANDS; i++) audioSpec[i] *= Math.exp(-dt / 0.2); return false; }

      ceilDb = Math.max(-55, Math.max(top, ceilDb - 1.2 * dt));
      const floor = ceilDb - 52;
      for (let i = 0; i < BANDS; i++) {

      Object.keys(TAU).forEach((k) => {
        const tau = k === 'hat' ? TAU.hat + 0.22 * env.hatOpen : TAU[k];

      const analysed = replay ? false : readAnalyser(dt);

      for (let i = 0; i < BANDS; i++) {
        let v = flowing ? audioSpec[i] : 0;
        if (!flowing) {
          const p = env.tomPos, tomShape = p > 0.65 ? SHAPES.tomH : p > 0.35 ? SHAPES.tomM : SHAPES.tomL;
          v = Math.max(env.kick * SHAPES.kick[i], env.snare * SHAPES.snare[i], env.hat * SHAPES.hat[i], env.tom * tomShape[i], env.crash * SHAPES.crash[i], env.ride * SHAPES.ride[i]);

          session.acc -= 1 / SESSION_RATE;

          session.frames.push(f);
        }
      }

    };

      get on() { return store.get('reconnect', false); },
      set on(v) { store.set('reconnect', !!v); },

    $('fs-button').addEventListener('click', fullscreen);

      if (['ab', 'A', 'B'].includes(p.space.cloud)) S.space.cloud = p.space.cloud;
      if (typeof p.space.depth === 'number') { S.space.depth = p.space.depth; $('depth').value = Math.round(S.space.depth * 100); $('depth-v').textContent = S.space.depth.toFixed(2); shell.syncRange($('depth')); }
      if (typeof p.space.size === 'number') { S.space.size = p.space.size; $('size').value = Math.round(S.space.size * 100); $('size-v').textContent = `${Math.round(S.space.size * 100)}%`; shell.syncRange($('size')); }
      if (typeof p.space.sway === 'boolean') { S.space.sway = p.space.sway; $('sway').checked = p.space.sway; }
      if (typeof p.space.yaw === 'number') S.space.yaw = p.space.yaw;
      if (typeof p.space.pitch === 'number') S.space.pitch = p.space.pitch;
      if (typeof p.space.dist === 'number') S.space.dist = p.space.dist;
      syncCloud();
    }
    if (p.gp) {
      if (['blend', 'A', 'B'].includes(p.gp.source)) {
        S.gp.source = p.gp.source;
        document.querySelectorAll('#gp-src button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.s === S.gp.source)));
      }
      if (['fast', 'std', 'deep'].includes(p.gp.effort)) { S.gp.effort = p.gp.effort; $('gp-effort').value = p.gp.effort; }
      if (typeof p.gp.keys === 'boolean') { S.gp.keys = p.gp.keys; $('gp-keys').checked = p.gp.keys; }
      if (Array.isArray(p.gp.best) && p.gp.best.length >= 16) {
        S.gp.best = new Float64Array(p.gp.best.slice(0, 16));
        S.gp.bestLoss = typeof p.gp.bestLoss === 'number' ? p.gp.bestLoss : 0;
        const tg = await gpTarget();
        if (tg) {
          const target = E.specDescriptor(tg.data, tg.rate); S.gp.target = target;
          const bd = E.candSpec(S.gp.best, target); drawGP(target, bd);
          $('gp-match').textContent = `${Math.round(Math.max(0, E.specCorr(bd, target)) * 100)}%`;
        }
        $('gp-stat').textContent = 'loaded';
      } else {
        S.gp.best = null; S.gp.bestLoss = 0; drawGP(null); $('gp-match').textContent = '-'; $('gp-stat').textContent = 'idle';
      }
    }
    if (['flat', 'space'].includes(p.view)) setView(p.view);
    syncMethod();
    setT(typeof p.t === 'number' ? p.t : 0.5);
    S.lastRender = null; S.audDirty = true;
    sourcesChanged();
  }
  if ($('save-project')) $('save-project').addEventListener('click', () => {
    download(new Blob([JSON.stringify(serializeProject(), null, 2)], { type: 'application/json' }), `${tag()}.displacer.json`);
  });
  if ($('load-project')) $('load-project').addEventListener('click', () => $('project-file').click());
  if ($('project-file')) $('project-file').addEventListener('change', async (e) => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const p = JSON.parse(await f.text());
      await applyProject(p);
      shell.toast(`Opened project ${f.name}.`);
    } catch (err) { shell.toast(`Could not open project: ${err.message}`); }
  });

  /* ---------- controls ---------- */
  shell.bindRange('t', (v) => { stopSweep(); setT(v / 1000); });
  shell.bindRange('t2', (v) => { stopSweep(); setT(v / 1000); });
  $('view-seg').addEventListener('click', (e) => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('method-row').addEventListener('click', (e) => { const b = e.target.closest('[data-m]'); if (b && !b.hidden) setMethod(b.dataset.m); });
  $('scope-on').checked = S.scope;
  $('scope-on').addEventListener('change', (e) => { S.scope = e.target.checked; scopeDirty = true; });
  $('phasemode').addEventListener('change', (e) => { S.phasemode = e.target.value; S.audDirty = true; scheduleRender(60); });
  $('xlaw').addEventListener('change', (e) => { S.xlaw = e.target.value; S.audDirty = true; scheduleRender(60); });
  shell.bindRange('mpmix', (v) => { S.mpMix = v / 100; $('mpmix-v').textContent = `${v}%`; S.audDirty = true; scheduleRender(400); });
  $('cloud-row').addEventListener('click', (e) => { const b = e.target.closest('[data-cloud]'); if (!b) return; S.space.cloud = b.dataset.cloud; syncCloud(); if (S.view !== 'space') setView('space'); });
  const bindPct = (id, get, set, fmt) => { const r = $(id); r.value = get(); $(`${id}-v`).textContent = fmt(+r.value); shell.bindRange(id, (v) => { set(v); $(`${id}-v`).textContent = fmt(v); }); };
  bindPct('depth', () => S.space.depth * 100, (v) => { S.space.depth = v / 100; }, (v) => (v / 100).toFixed(2));
  bindPct('size', () => S.space.size * 100, (v) => { S.space.size = v / 100; }, (v) => `${Math.round(v)}%`);
  $('sway').addEventListener('change', (e) => { S.space.sway = e.target.checked; });
  function stopSweep() {
    if (S.sweep) { S.sweep = false; $('sweep').checked = false; }
    if (S.bioAuto) { S.bioAuto = false; renderDispBio(); }
  }
  $('sweep').addEventListener('change', (e) => { if (e.target.checked) S.bioAuto = false; S.sweep = e.target.checked; S.sweepT = Math.acos(clamp(1 - 2 * S.t, -1, 1)) / (2 * Math.PI) * 24; renderDispBio(); });
  if ($('disp-bio-toggle')) $('disp-bio-toggle').addEventListener('click', () => {
    S.bioAuto = !S.bioAuto;
    if (S.bioAuto) {
      if (S.sweep) { S.sweep = false; $('sweep').checked = false; }
      if (eeg && eeg.state.phase === 'disconnected') S.bioDemo = true;
    }
    renderDispBio();
  });
  if ($('disp-bio-demo')) $('disp-bio-demo').addEventListener('click', () => {
    S.bioDemo = !S.bioDemo;
    if (S.bioDemo && !S.bioAuto) {
      S.bioAuto = true;
      if (S.sweep) { S.sweep = false; $('sweep').checked = false; }
    }
    renderDispBio();
  });
  document.querySelectorAll('[data-athena]').forEach((b) => b.addEventListener('click', () => {
    if (!eeg) return;
    eeg.setSensorMode(b.dataset.athena);
    if (!S.bioAuto) S.bioAuto = true;
    renderDispBio();
  }));
  function renderDispBio() {
    if (!eeg) return;
    const q = eeg.state, sm = q.sensorMode || 'eeg', sens = q.sensors || {};
    if ($('disp-bio-toggle')) {
      $('disp-bio-toggle').textContent = `Bio mod: ${S.bioAuto ? 'on' : 'off'}`;
      $('disp-bio-toggle').classList.toggle('on', S.bioAuto);
      $('disp-bio-toggle').setAttribute('aria-pressed', String(S.bioAuto));
    }
    if ($('disp-bio-demo')) {
      $('disp-bio-demo').textContent = `Synthetic preview: ${S.bioDemo ? 'on' : 'off'}`;
      $('disp-bio-demo').classList.toggle('on', S.bioDemo);
      $('disp-bio-demo').setAttribute('aria-pressed', String(S.bioDemo));
    }
    document.querySelectorAll('[data-athena]').forEach((b) => {
      const on = b.dataset.athena === sm;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', String(on));
    });
    if ($('disp-bio-status')) {
      const se = sens.eeg || {}, sf = sens.fnirs || {}, sp = sens.prv || {}, ss = sens.stillness || {};
      const parts = [
        `EEG ${se.score != null ? `${se.score}/100` : '-'}`,
        `fNIRS ${sf.od != null ? `${sf.od >= 0 ? '+' : ''}${sf.od.toFixed(3)} OD` : '-'}`,
        `PRV ${sp.rmssd != null ? `${Math.round(sp.rmssd)} ms` : '-'}`,
        `Stillness ${ss.score != null ? `${ss.score}/100` : '-'}`,
      ];
      $('disp-bio-status').textContent = S.bioAuto
        ? `${S.bioDemo ? 'Synthetic preview' : 'Muse S Athena'} · ${q.activeLabel || sm.toUpperCase()} driving t = ${S.t.toFixed(2)} · ${parts.join(' · ')}`
        : 'A real Muse S cannot connect to this page, so these modes run only as a labeled synthetic preview. The preview moves t by EEG balance, fNIRS optical, optical PRV, IMU stillness, or fusion.';
    }
  }
  $('swap').addEventListener('click', () => {
    [S.srcA, S.srcB] = [S.srcB, S.srcA]; if (S.srcA && S.srcB) E.prepAudio(); S.lastRender = null; S.audDirty = true;
    const n = S.names, b = S.built; [n.A, n.B] = [n.B, n.A]; [b.A, b.B] = [b.B, b.A];
    sourcesChanged();
  });
  function loadBuiltInPair(pair) {
    sourceRequests.A++; sourceRequests.B++;
    if (pair === 'cello-chimes') { setAudio('A', synthCello(), 'Bowed cello', true); setAudio('B', synthChimes(), 'Rain & chimes', true); }
    else if (pair === 'throat-harp') { setAudio('A', synthThroat(), 'Throat drone', true); setAudio('B', synthCrystalHarp(), 'FM crystal harp', true); }
    else if (pair === 'brass-glass') { setAudio('A', synthBrass(), 'Analog brass', true); setAudio('B', synthBowedGlass(), 'Bowed glass', true); }
    else if (pair === 'taiko-choir') { setAudio('A', synthTaiko(), 'Taiko pulse', true); setAudio('B', synthChoirCluster(), 'Choir cluster', true); }
    else { setAudio('A', synthVoice(), 'Sung ah', true); setAudio('B', synthBells(), 'Glass bells', true); }
  }
  if ($('builtin-pair')) $('builtin-pair').addEventListener('change', (e) => loadBuiltInPair(e.target.value));
  $('builtin-audio').addEventListener('click', () => loadBuiltInPair($('builtin-pair') ? $('builtin-pair').value : 'default'));
  ['A', 'B'].forEach((w) => {
    $(`file-${w}`).addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; loadFile(f, w); });
    $(`slot-${w}`).addEventListener('click', () => $(`file-${w}`).click());
  });
  ['thumb-A', 'thumb-B', 'sheet-thumb-A', 'sheet-thumb-B'].forEach((id) => thumbRO.observe($(id)));
  document.querySelector('.src-grid').addEventListener('click', (e) => { const b = e.target.closest('[data-pick]'); if (b) $(`file-${b.dataset.pick}`).click(); });

  /* drop anywhere: the left half is A, the right half is B; two files fill both */
  const drop = $('drop');
  let dragDepth = 0;
  const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
  addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; drop.hidden = false; });
  addEventListener('dragover', (e) => { if (!hasFiles(e)) return; e.preventDefault(); const right = e.clientX > innerWidth / 2; drop.dataset.side = right ? 'B' : 'A'; });
  addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) drop.hidden = true; });
  addEventListener('drop', async (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; drop.hidden = true;
    const files = [...e.dataTransfer.files];
    if (files.length >= 2) await Promise.all([loadFile(files[0], 'A'), loadFile(files[1], 'B')]);
    else await loadFile(files[0], e.clientX > innerWidth / 2 ? 'B' : 'A');
  });

  /* drag to turn the cloud, scroll to move closer; hover in spectrogram view to read time, frequency and pitch */
  const NOTE_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  function hzToNote(hz) {
    const m = Math.round(69 + 12 * Math.log2(Math.max(20, hz) / 440));
    return `${NOTE_NAMES[((m % 12) + 12) % 12]}${Math.floor(m / 12) - 1}`;
  }
  cv.addEventListener('pointerdown', (e) => { if (S.view !== 'space') return; dragging = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); moved(); });
  cv.addEventListener('pointermove', (e) => {
    if (S.view === 'flat' && $('spec-cursor') && S.lastRender) {
      const g = $('spectrogram-guide');
      if (g && !g.hidden) {
        const r = g.getBoundingClientRect();
        const u = clamp((e.clientX - r.left) / Math.max(1, r.width), 0, 1);
        const v = clamp(1 - (e.clientY - r.top) / Math.max(1, r.height), 0, 1);
        const dur = S.lastRender.data.length / (S.lastRender.rate || 22050);
        const hi = (S.lastRender.rate || 22050) / 2;
        const hz = 40 * Math.pow(hi / 40, v);
        const hzTxt = hz >= 1000 ? `${(hz / 1000).toFixed(2)} kHz` : `${Math.round(hz)} Hz`;
        $('spec-cursor').textContent = `Cursor: ${(u * dur).toFixed(2)} s · ${hzTxt} (${hzToNote(hz)}) · brighter = stronger`;
      }
    }
    if (!dragging) return;
    S.space.yaw += (e.clientX - dragging.x) * 0.006; S.space.pitch = clamp(S.space.pitch + (e.clientY - dragging.y) * 0.004, -1.2, 1.2); dragging = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointerleave', () => { if ($('spec-cursor')) $('spec-cursor').textContent = 'Time → · frequency ↑ · brighter = stronger'; });
  cv.addEventListener('pointerup', () => { dragging = null; });
  cv.addEventListener('pointercancel', () => { dragging = null; });
  cv.addEventListener('wheel', (e) => { if (S.view !== 'space') return; e.preventDefault(); S.space.dist = clamp(S.space.dist * Math.exp(e.deltaY * 0.0009), 1.4, 7); }, { passive: false });
  ['pointerdown', 'keydown'].forEach((ev) => addEventListener(ev, moved, { once: true, passive: true }));

  /* performance mode: the desktop app's borderless full screen, as the browser's Fullscreen API */
  function setPerform(on) {
    S.perform = on; document.body.classList.toggle('performance', on); $('perform-button').textContent = on ? 'Leave' : 'Perform';
    if (on) {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => shell.toast('Full screen is not available here, so only the controls are hidden. Press Esc to bring them back.'));
      shell.toast('Performing. Esc leaves. The mod wheel and the arrow keys still move the blend.');
    } else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    measureSafe();
  }
  $('perform-button').addEventListener('click', () => setPerform(!S.perform));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && S.perform) setPerform(false); setTimeout(measureSafe, 60); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.perform) setPerform(false); });

  /* MIDI as a controller: the mod wheel moves the blend, as the desktop app's MIDI bridge did; a keyboard can play a grown patch */
  kit.on('cc', ({ cc, value }) => { if (cc === 1) { stopSweep(); setT(value / 127, 'midi'); } });
  kit.on('hit', (h) => { if (S.gp.keys && S.gp.best && h.src === 'midi' && h.note != null) gpNote(clamp(h.note - 60, -24, 24), Math.max(0.35, Math.min(1, h.vel * 2))); });

  /* ---------- boot ---------- */
  if (!G || !(G.floatRT || G.gl.getExtension('EXT_color_buffer_half_float'))) {
    shell.glFail('This page needs WebGL2 with floating-point render targets, which this browser did not provide. The Blend and Save sheets still work.');
    const idle = (now) => { requestAnimationFrame(idle); kit.tick(now); shell.frame(now); };
    requestAnimationFrame(idle);
  } else {
    gl = G.gl;
    try {
      Post = createPost(G);
      pFlat = G.program(FLAT_FS); pPts = G.program(PTS_FS, PTS_VS);
      baseVao = gl.getParameter(gl.VERTEX_ARRAY_BINDING);
      tFlat = G.tex(2, 2, { internal: gl.RGBA8, format: gl.RGBA, type: gl.UNSIGNED_BYTE });
      gl.bindTexture(gl.TEXTURE_2D, tFlat); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      ptsVao = gl.createVertexArray(); ptsBuf = gl.createBuffer();
      gl.bindVertexArray(ptsVao); gl.bindBuffer(gl.ARRAY_BUFFER, ptsBuf);
      [[0, 3, 0], [1, 3, 3], [2, 3, 6], [3, 3, 9], [4, 2, 12]].forEach(([loc, size, off]) => { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 56, off * 4); });
      gl.bindVertexArray(baseVao);
      resize();
      addEventListener('resize', resize);
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); shell.glFail('The graphics context was lost. Reload the page to get the stage back.'); });
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      shell.glFail(`The stage could not start on this graphics card: ${String(e.message).slice(0, 140)}`);
    }
  }
  document.body.dataset.view = S.view;
  loadBuiltIn(); syncCloud();
  { const q = new URLSearchParams(location.search); if (['flat', 'space'].includes(q.get('view'))) setView(q.get('view')); }
  syncHear();

  // For the flicker check: the stage's brightness on a small grid, every frame, straight after it is drawn.
  let lumaRec = null;
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(cv, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames); }
      };
    });
  }

  window.__app = {
    S, kit, E, recordLuma, setT, setView, setMethod, loadFile, buildSpace, serializeProject, applyProject, loadBuiltInPair,
    get spaceN() { return spaceN; }, get spaceReady() { return spaceKey === wantKey() && !spaceBusy; }, get flat() { return { w: flatW, h: flatH, spec: flatSpec, ready: flatReady }; },
    get busy() { return !$('busy').hidden; }, get safe() { return safe; }, get playing() { return playSrc ? playKind : ''; }, currentRender,
    get audition() { return { playing: !!playSrc, pending: auditionPending, t: playBlendT, key: playKey, position: playSrc && AC ? AC.currentTime - playStart : 0, duration: playDur }; },
    pixel() {
      const c = document.createElement('canvas'); c.width = 32; c.height = 18; const g = c.getContext('2d');
      return new Promise((res) => { wantSnap = (blob) => { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let sum = 0, min = 1e9, max = 0; const grid = []; for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722; sum += l; min = Math.min(min, l); max = Math.max(max, l); grid.push(l); } res({ mean: sum / (d.length / 4), min, max, grid }); }; im.src = URL.createObjectURL(blob); }; });
    },
  };
})();
