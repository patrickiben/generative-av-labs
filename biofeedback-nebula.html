<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#101525">
<title>Biofeedback Nebula</title>
<meta name="description" content="A 3D particle nebula driven by your heart rate, HRV, paced breathing, or live drum kit; the Muse S modes are a labeled synthetic preview here. Not a medical device.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101525'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23b8b7ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23b8b7ff'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --bg: #101525;
  --ink: #eeedfb;
  --muted: #b6b9cf;
  --faint: #8d93ad;
  --accent: #b8b7ff;
  --line: rgba(191, 194, 236, 0.17);
  --glass: rgba(24, 28, 46, 0.72);
  --sheet: #1a2032;
  --soft: rgba(184, 183, 255, 0.1);
  --shadow: rgba(2, 6, 19, 0.45);
  --good: #bfe8a6;
  --warn: #f1cf8e;
  --bad: #f4a3a3;
  --demo: #e6c7a3;
  --serif: var(--sans);   /* headings use the interface sans-serif, as on Body Signal Labs */
  --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a, input, select { touch-action: manipulation; }
button { color: inherit; cursor: pointer; border: 0; background: none; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
a { color: var(--accent); }
[hidden] { display: none !important; }

.scene { position: relative; height: 100svh; min-height: 540px; isolation: isolate; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; touch-action: none; }
.vignette { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(5, 8, 18, 0.5) 0%, transparent 18%, transparent 58%, rgba(5, 8, 18, 0.72) 100%); }
.chrome { transition: opacity 0.7s ease; }
body.quiet .chrome { opacity: 0; }
body.quiet .chrome:focus-within { opacity: 1; }
body.quiet .chip { display: none; }

.header { position: absolute; left: 42px; right: 42px; top: max(28px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.brand { display: flex; align-items: center; gap: 12px; font-size: 16px; letter-spacing: -0.35px; color: var(--ink); text-shadow: 0 1px 14px rgba(0, 0, 0, 0.6); text-decoration: none; }
.brand svg { width: 24px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.15; }
.brand span { font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.top-action { border: 1px solid var(--line); border-radius: 999px; padding: 10px 15px; color: var(--ink); font-size: 12px; background: var(--glass); backdrop-filter: blur(12px); transition: background 0.25s; }
.top-action:hover { background: var(--soft); }
.top-action.icon { padding: 9px; display: grid; place-items: center; }
.top-action.icon svg { width: 16px; height: 16px; }
.mode-switch { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 30px; background: var(--glass); backdrop-filter: blur(12px); }
.mode-switch button { padding: 10px 27px; min-height: 38px; border-radius: 25px; font-size: 13px; color: var(--muted); transition: background 0.35s, color 0.35s; }
.mode-switch button[aria-pressed="true"] { background: var(--soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }

.intro { position: absolute; top: 17%; left: 20px; right: 20px; text-align: center; pointer-events: none; transition: opacity 0.9s ease, transform 0.9s ease; text-shadow: 0 1px 3px rgba(4, 6, 16, 0.55), 0 2px 26px rgba(4, 6, 16, 0.85); }
.intro::before { content: ""; position: absolute; left: 50%; top: 50%; width: min(1100px, 130%); height: 340px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.52), rgba(8, 10, 22, 0.28) 45%, transparent 72%); z-index: -1; }
body.playing .intro { opacity: 0; transform: translateY(-10px); }
.eyebrow { font-size: 10px; letter-spacing: 3.3px; color: var(--ink); text-transform: uppercase; margin: 0 0 17px; }
.intro h1 { font-family: var(--serif); font-size: clamp(34px, 4.3vw, 62px); font-weight: 400; letter-spacing: -1.4px; line-height: 1.15; margin: 0; }
.intro p:last-child { color: var(--ink); font-size: 13px; letter-spacing: 0.05px; margin: 15px 0 0; }

.dock-wrap { position: absolute; bottom: max(20px, calc(env(safe-area-inset-bottom) + 12px)); left: 12px; right: 12px; display: flex; align-items: center; flex-direction: column; gap: 12px; }
#hud { display: flex; align-items: flex-end; justify-content: center; gap: clamp(18px, 4vw, 56px); text-shadow: 0 1px 16px rgba(4, 6, 16, 0.85); }
.gauge { text-align: center; min-width: 74px; }
.gauge .k { display: block; font-size: 9px; letter-spacing: 2.4px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.gauge .v { font-size: 22px; font-weight: 300; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; }
.gauge .v small { font-size: 11px; font-weight: 400; color: var(--muted); letter-spacing: 0.2px; margin-left: 3px; }
.gauge.hero .v { font-size: clamp(44px, 5vw, 66px); font-weight: 200; letter-spacing: -2px; line-height: 1; }
.gauge.hero .v small { display: none; }

#hit-strip { display: flex; gap: 10px; align-items: center; justify-content: center; }
.hitdot { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 9px; letter-spacing: 1.4px; color: var(--muted); padding: 4px 7px; border-radius: 10px; border: 1px solid transparent; transition: background 0.18s, border-color 0.18s, color 0.18s; }
.hitdot:hover { background: var(--soft); border-color: var(--line); color: var(--ink); }
.hitdot i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); opacity: 0.16; box-shadow: 0 0 calc(var(--l, 0) * 18px) var(--accent); }
.stage-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); box-shadow: 0 8px 30px var(--shadow); }
.stage-bar .pill { padding: 6px 13px; font-size: 11px; }
.stage-bar .stage-slider { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); }
.stage-bar .stage-slider input[type="range"] { width: clamp(120px, 18vw, 200px); }
.stage-bar .stage-slider b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }

.badges { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; align-items: center; }
.source-badge, .chip { display: inline-flex; gap: 8px; align-items: center; font-size: 11px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; background: rgba(20, 24, 40, 0.68); padding: 8px 12px; backdrop-filter: blur(8px); }
.chip { color: var(--muted); max-width: 46vw; }
.chip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
.source-badge[data-source="live"] .dot, .chip[data-tone="good"] .dot { background: var(--good); box-shadow: 0 0 12px #bfe8a688; }
.source-badge[data-source="demo"] { border-color: #e6c7a366; background: rgba(66, 48, 28, 0.72); }
.source-badge[data-source="demo"] .dot { background: var(--demo); box-shadow: 0 0 10px #e6c7a388; }
.source-badge[data-source="replay"] .dot { background: #a8c6f4; }
.source-badge[data-source="open"] .dot, .chip[data-tone="warn"] .dot { background: var(--warn); }
.chip[data-tone="bad"] .dot { background: var(--bad); }
.chip[data-tone="wait"] .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.chip[data-tone="bad"] { color: #ffdcdc; border-color: rgba(244, 163, 163, 0.35); }
.chip[data-tone="good"] { color: var(--ink); }
.source-badge.keep { transition: none; }
body.quiet .keep-visible { opacity: 0.85; }
@keyframes pulse { 50% { opacity: 0.3; } }

.dock { display: flex; align-items: center; padding: 7px 9px; border: 1px solid var(--line); background: var(--glass); border-radius: 24px; box-shadow: 0 16px 60px var(--shadow); backdrop-filter: blur(24px); gap: 4px; }
.dock button { display: flex; align-items: center; flex-direction: column; gap: 7px; padding: 11px 19px 10px; border-radius: 17px; min-width: 74px; transition: background 0.2s; }
.dock button:hover, .dock button[aria-expanded="true"] { background: var(--soft); }
.dock button span { font-size: 10px; letter-spacing: 0.2px; color: var(--muted); }
.dock button.connected svg { color: var(--accent); }
.dock button.rec svg { color: var(--bad); }
.dock-divider { height: 30px; width: 1px; background: var(--line); margin: 0 5px; }
.truth { font-size: 10px; letter-spacing: 0.3px; color: var(--muted); text-align: center; margin: 0; max-width: 680px; line-height: 1.5; text-shadow: 0 1px 10px rgba(4, 6, 16, 0.9); }

.sheet:focus { outline: none; }
.sheet { color: var(--ink); background: var(--sheet); border: 1px solid var(--line); border-radius: 28px; padding: 30px; width: calc(100% - 32px); max-width: 480px; max-height: min(86svh, 780px); overflow-y: auto; box-shadow: 0 25px 100px #0005; }
.sheet.wide { max-width: 780px; }
.sheet::backdrop { background: #060c1690; backdrop-filter: blur(9px); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 16px; }
.sheet h2 { font-family: var(--serif); font-size: 30px; letter-spacing: -0.5px; font-weight: 400; margin: 0; }
.close { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); background: var(--soft); flex: none; }
.close svg { width: 17px; height: 17px; }
.sheet-intro { color: var(--muted); font-size: 13px; line-height: 1.65; margin: 12px 0 22px; }
.pill { border: 1px solid var(--line); border-radius: 999px; padding: 9px 15px; font-size: 12px; background: var(--soft); color: var(--ink); white-space: nowrap; transition: background 0.2s, border-color 0.2s; }
.pill:hover:not(:disabled) { border-color: var(--accent); }
.pill.primary { background: var(--accent); color: #141627; border-color: transparent; font-weight: 500; }
.pill.wide { width: 100%; padding: 12px 15px; font-size: 13px; }
.pill.on { background: var(--accent); color: #141627; }
.device-card { display: flex; align-items: flex-start; gap: 14px; padding: 16px 0 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.device-card svg.ic { width: 26px; height: 26px; fill: none; stroke: var(--accent); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 2px; }
.device-info { flex: 1; min-width: 0; }
.device-info strong { font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.device-info strong .dot { display: inline-block; }
.device-info[data-tone="good"] strong .dot { background: var(--good); box-shadow: 0 0 10px #bfe8a688; }
.device-info[data-tone="warn"] strong .dot { background: var(--warn); }
.device-info[data-tone="bad"] strong .dot { background: var(--bad); }
.device-info[data-tone="wait"] strong .dot { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
.device-info .state { font-size: 12px; color: var(--ink); margin: 5px 0 0; font-weight: 500; }
.device-info .why { font-size: 12px; color: var(--muted); margin: 3px 0 0; line-height: 1.5; }
.controls-grid { display: grid; gap: 11px; padding: 0 0 8px 40px; }
.field { display: grid; gap: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.15px; }
.field .row { display: flex; justify-content: space-between; gap: 10px; }
.field b { font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
select { background: #111627; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; width: 100%; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) calc(var(--val, 50) * 1%), var(--line) calc(var(--val, 50) * 1%)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); margin-top: -5.5px; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--ink); }
.meter { display: grid; gap: 3px; }
.meter div { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--good), var(--good) 70%, var(--warn) 88%, var(--bad)); }
pre.monitor { font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--muted); background: #111627; border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; margin: 0; min-height: 74px; white-space: pre-wrap; overflow: hidden; }
details { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; }
summary { font-size: 13px; cursor: pointer; color: var(--ink); padding: 3px 0; }
details > div, details > ol, details > p { font-size: 12px; color: var(--muted); line-height: 1.6; }
details ol { padding-left: 18px; margin: 10px 0 2px; }
details li { margin-bottom: 7px; }
.check { display: flex; gap: 9px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
.padrow { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 12px; }
.padrow code { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.padrow .pill { padding: 5px 11px; font-size: 11px; }

.sig-canvas { width: 100%; display: block; border-radius: 12px; background: #0b0f1c; border: 1px solid var(--line); }
.sig-title { display: flex; justify-content: space-between; gap: 12px; font-size: 10px; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); margin: 16px 0 7px; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; margin-top: 14px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(184, 183, 255, 0.04); }
.stat .k { display: block; font-size: 9px; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
.stat .v { font-size: 17px; font-weight: 300; font-variant-numeric: tabular-nums; }
.stat .n { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
table.maptable { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0 4px; }
table.maptable th, table.maptable td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--muted); font-weight: 400; }
table.maptable th { color: var(--ink); font-weight: 500; white-space: nowrap; }
.tag { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; margin: 10px 0; }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#toast { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 9px 15px; border-radius: 999px; font-size: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px); opacity: 0; pointer-events: none; transition: opacity 0.3s; max-width: 90vw; text-align: center; z-index: 5; }
#toast.show { opacity: 1; }
#gl-error { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: 460px; width: calc(100% - 40px); text-align: center; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 18px 22px; }

@media (max-width: 860px) {
  .header { left: 18px; right: 18px; top: max(14px, env(safe-area-inset-top)); }
  .mode-switch { top: max(62px, calc(env(safe-area-inset-top) + 48px)); }
  .mode-switch button { padding: 8px 24px; font-size: 12px; min-height: 34px; }
  .intro { top: 22%; }
  .eyebrow { font-size: 9px; letter-spacing: 2.6px; margin-bottom: 13px; }
  .intro h1 { font-size: 34px; letter-spacing: -1px; }
  .intro p:last-child { font-size: 12px; max-width: 280px; margin: 12px auto 0; line-height: 1.6; }
  .dock { padding: 5px; gap: 0; border-radius: 22px; }
  .dock button { padding: 10px 11px 9px; min-width: 62px; gap: 6px; }
  .dock button svg { width: 19px; height: 19px; }
  .dock-divider { margin: 0 2px; }
  .source-badge, .chip { font-size: 10px; padding: 7px 10px; }
  .truth { font-size: 10px; }
  #hud { gap: 12px; }
  .gauge { min-width: 62px; }
  .gauge .v { font-size: 18px; }
  .gauge.hero .v { font-size: 44px; }
  .sheet { padding: 24px; position: fixed; margin: auto auto 0; border-bottom-left-radius: 0; border-bottom-right-radius: 0; width: 100%; max-width: 560px; max-height: 88svh; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  .sheet.wide { max-width: 100%; }
  .sheet h2 { font-size: 27px; }
  .controls-grid { padding-left: 0; }
}
@media (max-height: 640px) {
  .intro { display: none; }
  .truth { display: none; }
  #hit-strip, .stage-bar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001s !important; transition-duration: 0.001s !important; }
}
/* biofeedback-nebula.css: Biofeedback overlays, reading display, breathing ring cues, and EEG/HR controls for Biofeedback Nebula */
.hud-set {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: center;
  gap: 10px clamp(18px, 3.2vw, 44px);
  position: relative;
  isolation: isolate;
}
.hud-set[hidden] { display: none !important; }
.hud-set.empty { display: none; }
.gauge .k {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.gauge .v.word {
  display: inline-block;
  font-size: 16px;
  line-height: 27px;
  text-transform: lowercase;
}
.ep {
  display: inline-block;
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  padding: 3px 5px;
  border-radius: 6px;
  border: 1px solid var(--line);
  color: var(--muted);
  font-weight: 500;
  vertical-align: 1px;
  white-space: nowrap;
}
.ep-measured { color: var(--good); border-color: rgba(191, 232, 166, 0.35); }
.ep-inferred { color: #d6c7ff; border-color: rgba(214, 199, 255, 0.4); }
.ep-proxy { color: #9fe3e0; border-color: rgba(159, 227, 224, 0.4); }
.ep-demo { color: var(--demo); border-color: rgba(230, 199, 163, 0.45); }
.ep-proc { color: var(--muted); }

.reading {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 27%;
  text-align: center;
  pointer-events: none;
  z-index: 8;
  text-shadow: 0 1px 3px rgba(4, 6, 16, 0.6), 0 2px 26px rgba(4, 6, 16, 0.85);
}
.reading::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 48%;
  width: min(720px, 115%);
  height: 136%;
  transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at center, rgba(8, 10, 22, 0.48), rgba(8, 10, 22, 0.24) 48%, transparent 74%);
  z-index: -1;
}
.reading .eyebrow { margin-bottom: 6px; }
.read-num {
  font-size: clamp(46px, 6vw, 74px);
  font-weight: 200;
  letter-spacing: -2.5px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.read-tier { font-size: 14px; margin: 5px 0 8px; }
.read-scale {
  position: relative;
  width: 170px;
  height: 3px;
  margin: 0 auto 8px;
  border-radius: 3px;
  background: linear-gradient(90deg, #8be6dc, #b8b7ff 52%, #f4a9c6);
  box-shadow: 0 1px 8px rgba(4, 6, 16, 0.6);
}
.read-scale.forming { background: var(--line); }
.read-scale i {
  position: absolute;
  top: 50%;
  width: 11px;
  height: 11px;
  margin: -5.5px 0 0 -5.5px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
  transition: left 0.9s ease;
}
.read-scale u {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  border-radius: 3px;
  background: var(--ink);
  transition: width 0.5s linear;
}

  height: 0;

}

  left: 0;
  top: -22px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-family: var(--serif);
  font-size: clamp(23px, 2.2vw, 31px);
  letter-spacing: -0.5px;
  text-shadow: 0 1px 3px rgba(4, 6, 16, 0.65), 0 2px 26px rgba(4, 6, 16, 0.9);
}

  position: absolute;
  left: 0;
  top: 28px;
  transform: translateX(-50%);
  width: min(80vw, 420px);
  text-align: center;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  text-shadow: 0 1px 3px rgba(4, 6, 16, 0.7), 0 2px 18px rgba(4, 6, 16, 0.9);

  gap: 8px;

  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--muted);
}
.tp-row .k {

  align-items: center;
  gap: 6px;
  font-size: 9px;
  letter-spacing: 2.2px;
  text-transform: uppercase;
}
.tp-row b {

  font-weight: 300;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.tp-hold {

  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.tp-bar {
  position: relative;
  height: 4px;
  border-radius: 4px;
  background: var(--line);
}
.tp-bar i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.5s linear;
}
.tp-bar u {
  position: absolute;
  left: 60%;
  top: -3px;
  width: 1px;
  height: 10px;
  background: var(--ink);
  opacity: 0.7;
}
.tp-controls { flex-wrap: wrap; }
.tp-pace {

  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 200px;
}
.tp-pace input { flex: 1; min-width: 70px; }
.tp-pace b { font-size: 12px; font-weight: 400; }
.tp-controls .pill { padding: 7px 12px; font-size: 11px; }

.eeg-connect {

  padding: 16px;
  margin: 14px 0;

.eeg-connect .row-actions { margin: 10px 0; }

.quiet-pill { justify-self: start; background: transparent; }

.stage-sep {

  margin: 0 4px;
}
.stage-sub {
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);

  .reading { top: 210px; }
  .reading .eyebrow, #read-cov, .read-more { display: none; }
  .read-num { font-size: 42px; }
}

  /* ------------------------------------------------- the kit */

  function createKit() {

    const column = new Uint8Array(BANDS * 2);

    let ctx = null, inputBus = null, analyser = null, worklet = null, sink = null, recDest = null;
    let stream = null, micNode = null, connectSeq = 0, lastSignal = -1e12, freqData = null, binEdges = null;
    let midiAccess = null, demo = null, replay = null, session = null;
    let lastFlash = -1e12, keysT = -1e12, lastTick = 0, ceilDb = -55, lastTempo = 0;
    const hitLog = [];                                      // recent hits, newest last
    const tempoT = [], tempoW = [];

    let map = store.get('map', null) || JSON.parse(JSON.stringify(PRESETS.ekit.notes));
    let presetId = store.get('preset', 'ekit');

      for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
      const out = { schema: 'generative-av-labs/session@1', app: s.app, created: s.created, durationMs: Math.round(durationMs), note: 'Levels and events only. No audio is stored in this file.', bands: BANDS, frameRate: SESSION_RATE, hits: s.hits, ctrl: s.ctrl, lanes: s.lanes, spectrumBase64: btoa(bin) };
      notifyState();
      return out;
    };
    kit.startReplay = (s) => {
      const frames = validateSession(s);
      if (demo) kit.stopDemo();
      replay = { s, frames, t0: performance.now(), hi: 0, ci: 0, lanes: Object.entries(s.lanes || {}).map(([k, v]) => ({ k, v, i: 0 })) };
      if (micNode) { try { micNode.disconnect(); } catch (e) { /* not connected */ } }
      notifyState();
      emit('replay', true);
    };
    kit.stopReplay = () => {
      if (!replay) return;
      replay = null;
      if (micNode) micNode.connect(inputBus);
      audioSpec.fill(0);
      notifyState();
      emit('replay', false);
    };
    function stepReplay(now) {
      const R = replay, t = now - R.t0, s = R.s;
      while (R.hi < s.hits.length && s.hits[R.hi].t <= t) { const h = s.hits[R.hi++]; hit(h.pad, h.vel, 'replay', { note: h.note }); }
      while (R.ci < s.ctrl.length && s.ctrl[R.ci].t <= t) { const c = s.ctrl[R.ci++]; if (c.k === 'pedal') pedal(c.v, 'replay'); else choke(c.v); }
      R.lanes.forEach((l) => { while (l.i < l.v.length && l.v[l.i][0] <= t) { const p = l.v[l.i++]; emit('lane', { name: l.k, value: p[1] }); } });
      const fr = Math.floor((t / 1000) * (s.frameRate || SESSION_RATE)) * BANDS;
      if (fr + BANDS <= R.frames.length) for (let i = 0; i < BANDS; i++) audioSpec[i] = R.frames[fr + i] / 255;
      if (t >= s.durationMs) kit.stopReplay();
    }

    kit.recordingStream = () => {
      if (!ctx || !inputBus) return null;
      if (!recDest) { recDest = ctx.createMediaStreamDestination(); inputBus.connect(recDest); }
      return recDest.stream;
    };

    /* ---------------- the per-frame update ---------------- */
    function readAnalyser(dt) {
      if (!analyser || !(stream || demo)) { for (let i = 0; i < BANDS; i++) audioSpec[i] *= Math.exp(-dt / 0.2); return false; }
      analyser.getFloatFrequencyData(freqData);
      let top = -120, lsum = 0, asum = 0;
      for (let i = 0; i < BANDS; i++) {
        const a = binEdges[i], b = binEdges[i + 1];
        let v = -160;
        if (b - a < 1) {
          const k = Math.floor((a + b) / 2), f = (a + b) / 2 - k;
          v = (freqData[k] || -160) * (1 - f) + (freqData[k + 1] || -160) * f;
        } else {
          for (let k = Math.floor(a); k < Math.ceil(b); k++) if (freqData[k] > v) v = freqData[k];
        }
        if (!isFinite(v)) v = -160;
        v += 3 * Math.log2(bandFreq(i) / 1000);                // gentle tilt so cymbals read beside the kick
        rawDb[i] = v;
        if (v > top) top = v;
        const lin = Math.pow(10, v / 20);
        lsum += Math.log(lin + 1e-9); asum += lin;
      }
      // Rolling reference: the top of the range follows the loudest recent level, so a quiet or loud kit both fill it.
      ceilDb = Math.max(-55, Math.max(top, ceilDb - 1.2 * dt));
      const floor = ceilDb - 52;
      for (let i = 0; i < BANDS; i++) {
        const n = clamp((rawDb[i] - floor) / (ceilDb - floor), 0, 1);
        const shaped = n * n * (1.6 - 0.6 * n);
        audioSpec[i] = shaped > audioSpec[i] ? shaped : audioSpec[i] * Math.exp(-dt / 0.14) + shaped * (1 - Math.exp(-dt / 0.14));
      }
      kit.tonal += (clamp(1 - Math.exp(lsum / BANDS) / ((asum / BANDS) || 1), 0, 1) - kit.tonal) * Math.min(1, dt / 0.05);
      return true;
    }

    kit.tick = (now) => {
      now = now == null ? performance.now() : now;
      const dt = clamp((now - (lastTick || now)) / 1000, 0, 0.1);
      lastTick = now;

      Object.keys(TAU).forEach((k) => {
        const tau = k === 'hat' ? TAU.hat + 0.22 * env.hatOpen : TAU[k];
        env[k] *= Math.exp(-dt / tau);
      });
      if (replay) stepReplay(now);
      const analysed = replay ? false : readAnalyser(dt);
      const flowing = replay || (analysed && (demo || now - lastSignal < LIVE_HOLD_MS));
      for (let i = 0; i < BANDS; i++) {
        let v = flowing ? audioSpec[i] : 0;
        if (!flowing) {
          const p = env.tomPos, tomShape = p > 0.65 ? SHAPES.tomH : p > 0.35 ? SHAPES.tomM : SHAPES.tomL;
          v = Math.max(env.kick * SHAPES.kick[i], env.snare * SHAPES.snare[i], env.hat * SHAPES.hat[i], env.tom * tomShape[i], env.crash * SHAPES.crash[i], env.ride * SHAPES.ride[i]);
          v *= 0.92;
        }
        spectrum[i] = v;
      }
      let lo = 0, mi = 0, hi = 0;
      for (let i = 0; i < BANDS; i++) { const f = i / BANDS; if (f < 0.3) lo += spectrum[i]; else if (f < 0.7) mi += spectrum[i]; else hi += spectrum[i]; }
      kit.low = lo / (BANDS * 0.3); kit.mid = mi / (BANDS * 0.4); kit.high = hi / (BANDS * 0.3);
      const inst = (kit.low + kit.mid + kit.high) / 3;
      kit.loud += (inst - kit.loud) * Math.min(1, dt / (inst > kit.loud ? 0.03 : 0.35));

      // State clocks. These are what a visitor reads, so they keep running whether or not the page has focus.
      if (stream && !demo && audio.state !== 'requesting') {
        audio.quietMs = lastSignal > 0 ? now - lastSignal : 0;
        if (audio.state === 'live' && now - lastSignal > LIVE_HOLD_MS) setAudio('no-signal');
      }
      if (midi.state === 'live' && now - midi.lastT > MIDI_HOLD_MS) setMidi('no-signal');
      if (midi.lastT) midi.quietMs = now - midi.lastT;
      kit.hitAge = kit.lastHit ? now - kit.lastHit.t : null;

      if (now - lastTempo > 240) {
        lastTempo = now;
        const nowS = now / 1000;
        const fresh = tempoT.length && nowS - tempoT[tempoT.length - 1] < 3.5;
        kit.tempo = fresh ? estimateTempo(tempoT, tempoW) : { bpm: null, conf: 0 };
      }

      histAcc += dt;
      while (histAcc >= 1 / HIST_RATE) {
        histAcc -= 1 / HIST_RATE;
        histX = (histX + 1) % HIST_W;
        const ton = Math.round(kit.tonal * 255);
        for (let i = 0; i < BANDS; i++) {
          const v = Math.round(spectrum[i] * 255), o = (histX + i * HIST_W) * 2;
          hist[o] = v; hist[o + 1] = ton;
          column[i * 2] = v; column[i * 2 + 1] = ton;
        }
        emit('column', histX);
      }

      if (session) {
        session.acc += dt;
        while (session.acc >= 1 / SESSION_RATE) {
          session.acc -= 1 / SESSION_RATE;
          const f = new Uint8Array(BANDS);
          for (let i = 0; i < BANDS; i++) f[i] = Math.round(spectrum[i] * 255);
          session.frames.push(f);
        }
      }
      emit('frame', kit);
    };

    kit.feedMidi = (bytes) => handleMidi(bytes, 'midi');     // same path a real port uses; the tests call this too
    kit.autoconnect = {
      get on() { return store.get('reconnect', false); },
      set on(v) { store.set('reconnect', !!v); },
    };
    kit.tryReconnect = async () => {
      if (!store.get('reconnect', false)) return;
      try {
        const mic = await navigator.permissions.query({ name: 'microphone' });
        if (mic.state === 'granted') kit.connectAudio();
      } catch (e) { /* the query is not available everywhere */ }
      try {
        const m = await navigator.permissions.query({ name: 'midi' });
        if (m.state === 'granted') kit.connectMidi();
      } catch (e) { /* the query is not available everywhere */ }
    };

    if (!global.isSecureContext) { audio.state = 'insecure'; audio.detail = 'Audio capture needs HTTPS or localhost.'; midi.state = 'insecure'; midi.detail = 'Web MIDI needs HTTPS or localhost.'; }

      if (!navigator.requestMIDIAccess) { midi.state = 'unsupported'; midi.detail = 'This browser has no Web MIDI. Use Chrome or Edge for MIDI; audio still works here.'; }

  global.KitMath = { classify, estimateTempo, analyzeSession, bandFreq, BANDS, PADS, PRESETS };
})(window);

        <div class="sheet-head"><h2 id="session-title">Keep what you played.</h2>${closeBtn('Close session')}</div>
        <p class="sheet-intro">${esc((cfg.session && cfg.session.intro) || 'A session file holds hits, pedal moves and levels. No audio goes in it, and nothing leaves this computer unless you share the file.')}</p>
        <div class="row-actions">
          <button class="pill primary" id="rec-toggle">Start recording</button>
          <button class="pill" id="replay-load">Replay a session file</button>
          <button class="pill" id="replay-stop" hidden>Stop replay</button>
          <button class="pill" id="snapshot">Save a picture</button>
          <input type="file" id="replay-file" accept="application/json,.json" hidden>
        </div>
        <label class="check"><input type="checkbox" id="rec-video"> Also save a video of the screen, with the input's sound if there is any</label>
        <p class="note" id="rec-status" role="status">Not recording.</p>
        <div id="session-analysis"></div>
      </dialog>

${useSignal ? `      <dialog class="sheet wide" id="signal-sheet" aria-labelledby="signal-title" tabindex="-1">
        <div class="sheet-head"><h2 id="signal-title">What the page hears.</h2>${closeBtn('Close signal view')}</div>
        <div class="statgrid">
          <div class="stat"><span class="k">Tempo</span><span class="v" id="sig-tempo">-</span><span class="n">estimated from hits</span></div>
          <div class="stat"><span class="k">Hits</span><span class="v" id="sig-hits">0</span><span class="n" id="sig-source">no source yet</span></div>
          <div class="stat"><span class="k">Input peak</span><span class="v" id="sig-peak">-</span><span class="n" id="sig-ch">no audio</span></div>
          <div class="stat"><span class="k">Hit to frame</span><span class="v" id="sig-lat">-</span><span class="n">page only, excludes the display</span></div>
          <div class="stat"><span class="k">Frame rate</span><span class="v" id="sig-fps">-</span><span class="n" id="sig-quality">-</span></div>
        </div>
        <div class="sig-title"><span>Spectrum over the last 12 seconds</span><span>low to high, newest on the right</span></div>
        <canvas class="sig-canvas" id="sig-spectro" width="1400" height="300" role="img" aria-label="Scrolling spectrogram of the input"></canvas>
        <div class="sig-title"><span>Hits over the last 8 seconds</span><span id="sig-legend">dot size is velocity</span></div>
        <canvas class="sig-canvas" id="sig-lanes" width="1400" height="230" role="img" aria-label="Timeline of hits by drum"></canvas>
      </dialog>` : ''}

      <dialog class="sheet" id="about-sheet" aria-labelledby="about-title" tabindex="-1">
        <div class="sheet-head"><h2 id="about-title">What drives what.</h2>${closeBtn('Close about')}</div>
        ${cfg.about}
        ${kitInputs ? `<details><summary>From MIDI, from audio</summary>
          <p>MIDI names the drum you hit, with its velocity, plus the hi-hat pedal and cymbal chokes. With audio alone, kick, snare, hat, tom and crash are estimated from four frequency bands by a stated rule, and a ride is not told apart. With MIDI alone, each hit paints a stated spectrum shape instead of a measured one.</p>
          <p>Hit to frame is what this page measures. It leaves out the interface, the cable and the screen.</p>
        </details>` : ''}
        <details><summary>Safety and privacy</summary>
          <p>A limiter slows any large change in brightness, and these pages measure under the WCAG limit of three flashes a second, even with hard playing. That is a measured screen, not a medical guarantee. If flashing or moving light affects you, take care, and turn on your system's reduced-motion setting, which tightens the limiter, calms the camera and removes the flash.</p>
          <p>${esc(cfg.privacy || 'Audio and MIDI are analyzed in this browser and never sent anywhere. The pages make no network requests after they load. Your device choice and pad map stay in this browser\'s storage.')}</p>
        </details>
        <details><summary>Ideas credited</summary>
          ${cfg.credits || `<p>No outside code is included. Ideas came from <a href="https://github.com/jberg/butterchurn" rel="noopener">Butterchurn</a> (MIT), Milkdrop's feedback warp; <a href="https://github.com/PavelDoGreat/WebGL-Fluid-Simulation" rel="noopener">WebGL Fluid Simulation</a> (MIT), one splat per impact; <a href="https://github.com/loqwai/paper-cranes" rel="noopener">paper-cranes</a> (BSD-3-Clause), reading each audio feature against its own recent range; <a href="https://github.com/audiojs/beat" rel="noopener">@audio/beat</a>, energy flux for percussive onsets; and <a href="https://github.com/dlepaux/realtime-bpm-analyzer" rel="noopener">realtime-bpm-analyzer</a> (Apache-2.0), tempo from live input.</p>`}
        </details>
        <p class="note"><a href="field-guide.html">Read the field guide</a> · <a href="https://github.com/patrickiben/generative-av-labs" rel="noopener">Source</a></p>
      </dialog>`);

    /* ---------- sheets ---------- */
    const openSheet = (name) => {
      const d = $(`${name}-sheet`);
      if (!d || d.open) return;
      if (typeof d.showModal === 'function') d.showModal(); else d.setAttribute('open', '');
      d.focus({ preventScroll: true });
      const b = $(`${name}-button`); if (b) b.setAttribute('aria-expanded', 'true');
      if (name === 'signal') drawSignal(true);
    };
    document.querySelectorAll('dialog.sheet').forEach((d) => {
      const name = d.id.replace('-sheet', '');
      d.addEventListener('close', () => { const b = $(`${name}-button`); if (b) { b.setAttribute('aria-expanded', 'false'); b.focus({ preventScroll: true }); } });
      d.addEventListener('click', (e) => { if (e.target === d) d.close(); });
      d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => d.close()));
    });
    [...dockItems.map((d) => d.id), 'about'].forEach((name) => $(`${name}-button`).addEventListener('click', () => openSheet(name)));
    ['source-badge', ...chips.map((c) => `chip-${c.id}`)].forEach((id) => $(id).addEventListener('click', () => openSheet('connect')));

    /* ---------- modes ---------- */
    let mode = cfg.mode;
    const modeButtons = [...document.querySelectorAll('.mode-switch button')];
    const setMode = (m) => {
      mode = m;
      modeButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
      if (cfg.onMode) cfg.onMode(m);
    };
    modeButtons.forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));

    /* ---------- demo and input buttons ---------- */
    const toast = (msg, ms) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 3200); };
    const demoOn = () => (cfg.demo ? cfg.demo.isOn() : kit.demoOn);
    const toggleDemo = async () => {
      if (cfg.demo) { cfg.demo.toggle(); renderStates(); return; }
      if (kit.demoOn) kit.stopDemo(); else { try { await kit.startDemo(); } catch (e) { toast(`The demo could not start: ${e.message}`); } }
    };
    $('demo-button').addEventListener('click', toggleDemo);
    const syncRange = (r) => r.style.setProperty('--val', ((+r.value - +r.min) / (+r.max - +r.min)) * 100);
    const bindRange = (id, fn) => { const r = $(id); syncRange(r); r.addEventListener('input', () => { syncRange(r); fn(+r.value); }); };

    /* ---------- pad map ---------- */
    let presetSel = null, mapKey = '';
    const renderMap = () => {
      if (!presetSel || !$('pad-rows')) return;
      const key = JSON.stringify([kit.map, kit.presetId, kit.learning]);
      if (key === mapKey) return;
      mapKey = key;
      presetSel.innerHTML = Object.entries(kit.PRESETS).map(([id, p]) => `<option value="${id}">${esc(p.name)}</option>`).join('') + (kit.presetId === 'custom' ? '<option value="custom">Your learned map</option>' : '');
      presetSel.value = kit.presetId;
      $('pad-rows').innerHTML = kit.PADS.map((p) => `<div class="padrow"><span>${esc(p.label)}</span><code>${(kit.map[p.id] || []).join(', ') || 'none'}</code><button class="pill${kit.learning === p.id ? ' on' : ''}" data-learn="${p.id}">${kit.learning === p.id ? 'Hit the pad' : 'Learn'}</button></div>`).join('');
    };

    function wireKitSheet() {
      $('demo-sheet').addEventListener('click', async () => { await toggleDemo(); if (kit.demoOn) $('connect-sheet').close(); });
      $('demo-audible').addEventListener('change', (e) => kit.setDemoAudible(e.target.checked));
      $('audio-connect').addEventListener('click', () => { const s = kit.audio.state; if (s === 'live' || s === 'no-signal') kit.disconnectAudio(); else kit.connectAudio(); });
      $('midi-connect').addEventListener('click', () => { const s = kit.midi.state; if (s === 'live' || s === 'no-signal') kit.disconnectMidi(); else kit.connectMidi(); });
      $('connect-both').addEventListener('click', async () => { await kit.connectAudio(); await kit.connectMidi(); });
      $('audio-device').addEventListener('change', (e) => kit.connectAudio(e.target.value));
      $('midi-port').addEventListener('change', (e) => kit.selectMidi(e.target.value));
      $('trim').value = kit.audio.trimDb; $('sens').value = Math.round(kit.audio.sens * 100);
      $('trim-val').textContent = `${kit.audio.trimDb > 0 ? '+' : ''}${kit.audio.trimDb} dB`;
      $('sens-val').textContent = kit.audio.sens.toFixed(2);
      bindRange('trim', (v) => { kit.setTrim(v); $('trim-val').textContent = `${v > 0 ? '+' : ''}${v} dB`; });
      bindRange('sens', (v) => { kit.setSensitivity(v / 100); $('sens-val').textContent = (v / 100).toFixed(2); });
      $('reconnect').checked = kit.autoconnect.on;
      $('reconnect').addEventListener('change', (e) => { kit.autoconnect.on = e.target.checked; });
      $('flip-pedal').checked = kit.midi.flipPedal;
      $('flip-pedal').addEventListener('change', (e) => kit.setFlipPedal(e.target.checked));
      presetSel = $('map-preset');
      presetSel.addEventListener('change', () => kit.usePreset(presetSel.value));
      $('pad-rows').addEventListener('click', (e) => { const b = e.target.closest('[data-learn]'); if (b) kit.learn(b.dataset.learn); });
    }
    if (kitInputs && !cfg.connect) wireKitSheet();
    document.querySelectorAll('.sheet input[type="range"]').forEach(syncRange);

    /* ---------- state rendering ---------- */
    const setSelect = (sel, opts, value) => {
      const key = JSON.stringify(opts);
      if (sel.dataset.key !== key) { sel.innerHTML = opts.map((o) => `<option value="${esc(o.id)}">${esc(o.label)}</option>`).join(''); sel.dataset.key = key; }
      if (value != null && [...sel.options].some((o) => o.value === value)) sel.value = value;
    };
    const renderStates = () => {
      const [src, label] = cfg.source ? cfg.source() : sourceView(kit);
      const badge = $('source-badge');
      if (badge.dataset.source !== src) badge.dataset.source = src;
      if ($('source-label').textContent !== label) $('source-label').textContent = label;
      $('demo-button').textContent = demoOn() ? 'End demo' : 'Try a demo';
      if (!kitInputs || cfg.connect) {
        chips.forEach((c) => { if (!c.read) return; const [tone, text] = c.read(); const el = $(`chip-${c.id}`); if (el.dataset.tone !== tone) el.dataset.tone = tone; if ($(`chip-${c.id}-text`).textContent !== text) $(`chip-${c.id}-text`).textContent = text; });
        const spoken = `${label}.`;
        if ($('sr-status').textContent !== spoken) $('sr-status').textContent = spoken;
        if (cfg.onStates) cfg.onStates();
        return;
      }
      const a = audioView(kit.audio), m = midiView(kit.midi);
      $('chip-audio').dataset.tone = a.tone; $('chip-midi').dataset.tone = m.tone;
      $('chip-audio-text').textContent = a.chip; $('chip-midi-text').textContent = m.chip;
      $('audio-info').dataset.tone = a.tone; $('midi-info').dataset.tone = m.tone;
      $('audio-state').textContent = a.state; $('audio-why').textContent = a.why;
      $('midi-state').textContent = m.state; $('midi-why').textContent = m.why;
      const aOpen = kit.audio.state === 'live' || kit.audio.state === 'no-signal';
      const mOpen = kit.midi.state === 'live' || kit.midi.state === 'no-signal';
      $('audio-connect').textContent = aOpen ? 'Disconnect' : kit.audio.state === 'requesting' ? 'Waiting' : kit.audio.state === 'idle' ? 'Connect' : 'Try again';
      $('midi-connect').textContent = mOpen ? 'Disconnect' : kit.midi.state === 'requesting' ? 'Waiting' : kit.midi.state === 'idle' ? 'Connect' : 'Try again';
      $('audio-connect').disabled = kit.audio.state === 'unsupported' || kit.audio.state === 'insecure' || kit.audio.state === 'requesting';
      $('midi-connect').disabled = kit.midi.state === 'unsupported' || kit.midi.state === 'insecure' || kit.midi.state === 'requesting';
      $('connect-both').hidden = aOpen && mOpen;
      $('audio-controls').hidden = !aOpen; $('midi-controls').hidden = !(mOpen || kit.midi.inputs.length);
      if (aOpen) setSelect($('audio-device'), kit.audio.devices, kit.audio.deviceId);
      if (kit.midi.inputs.length) {
        setSelect($('midi-port'), [{ id: 'all', label: `All inputs (${kit.midi.inputs.length})` }, ...kit.midi.inputs.map((p) => ({ id: p.id, label: p.manufacturer && !p.name.includes(p.manufacturer) ? `${p.name} · ${p.manufacturer}` : p.name }))], kit.midi.inputId);
      }
      const spoken = `Audio: ${kit.audio.state.replace('-', ' ')}. MIDI: ${kit.midi.state.replace('-', ' ')}. ${src === 'demo' ? 'Demo running.' : ''}`;
      if ($('sr-status').textContent !== spoken) $('sr-status').textContent = spoken;
      $('connect-button').classList.toggle('connected', aOpen || mOpen);
      $('demo-sheet').textContent = kit.demoOn ? 'End demo' : 'Run demo';
      $('replay-stop').hidden = !kit.replayOn;
      renderMap();
    };
    kit.on('state', renderStates);
    renderStates();

    /* ---------- recording ---------- */
    let recorder = null;
    const download = (blob, name) => { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
    const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
    $('rec-toggle').addEventListener('click', () => {
      if (!kit.recording) {
        kit.startRecording(cfg.id);
        let videoProblem = '';
        if ($('rec-video').checked) {
          let st = null;
          try {
            if (!cfg.canvas().captureStream || !global.MediaRecorder) throw new Error('this browser does not support screen recording');
            st = cfg.canvas().captureStream(60);
            const sound = kit.recordingStream();
            // The kit owns a persistent audio destination. Each take owns clones,
            // so cleaning up this capture cannot silence the next recording.
            if (sound) sound.getAudioTracks().forEach((t) => st.addTrack(t.clone()));
            const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find((m) => MediaRecorder.isTypeSupported(m));
            const activeRecorder = new MediaRecorder(st, mime ? { mimeType: mime, videoBitsPerSecond: 14e6 } : {});
            const chunks = [], takeStamp = stamp();
            let failed = false;
            activeRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
            activeRecorder.onerror = () => {
              failed = true;
              toast('Video recording failed. The session data is still available.');
              if (recorder === activeRecorder) {
                recorder = null;
                $('rec-status').textContent = 'Video could not be recorded. Session data is still recording; press Stop and save.';
              }
              if (activeRecorder.state !== 'inactive') activeRecorder.stop();
            };
            activeRecorder.onstop = () => {
              try {
                if (!failed && chunks.length) download(new Blob(chunks, { type: activeRecorder.mimeType }), `${cfg.id}-${takeStamp}.${(activeRecorder.mimeType || '').includes('mp4') ? 'mp4' : 'webm'}`);
              } finally {
                st.getTracks().forEach((t) => t.stop());
                if (recorder === activeRecorder) recorder = null;
              }
            };
            recorder = activeRecorder;
            activeRecorder.start(1000);
          } catch (err) {
            if (st) st.getTracks().forEach((t) => t.stop());
            recorder = null;
            videoProblem = ` Video could not start: ${err.message}. Session data is still being recorded.`;
          }
        }
        $('rec-toggle').textContent = 'Stop and save';
        $('session-button').classList.add('rec');
        $('rec-status').textContent = `Recording. Play, then press Stop and save.${videoProblem}`;
      } else {
        const s = kit.stopRecording();
        const stoppedRecorder = recorder;
        recorder = null;
        if (stoppedRecorder && stoppedRecorder.state !== 'inactive') stoppedRecorder.stop();
        download(new Blob([JSON.stringify(s)], { type: 'application/json' }), `${cfg.id}-session-${stamp()}.json`);
        $('rec-toggle').textContent = 'Start recording';
        $('session-button').classList.remove('rec');
        $('rec-status').textContent = cfg.session && cfg.session.summary ? cfg.session.summary(s) : `Saved ${s.hits.length} hits over ${Math.round(s.durationMs / 1000)} s.`;
        if (!(cfg.session && cfg.session.summary)) renderAnalysis(s);
      }
    });
    $('replay-load').addEventListener('click', () => $('replay-file').click());
    $('replay-stop').addEventListener('click', () => kit.stopReplay());
    $('replay-file').addEventListener('change', async (e) => {
      const f = e.target.files[0]; e.target.value = '';
      if (!f) return;
      try {
        const s = JSON.parse(await f.text());
        kit.startReplay(s);
        if (!(cfg.session && cfg.session.summary)) renderAnalysis(s);
        $('rec-status').textContent = `Replaying a session from ${new Date(s.created).toLocaleString()}.`;
        $('session-sheet').close();
      } catch (err) { $('rec-status').textContent = `That file could not be replayed: ${err.message}`; }
    });
    $('snapshot').addEventListener('click', () => { if (cfg.snapshot) cfg.snapshot((blob) => download(blob, `${cfg.id}-${stamp()}.png`)); });
    function renderAnalysis(s) {
      const A = KitMath.analyzeSession(s), rows = Object.entries(A.perVoice).filter(([, p]) => p.n);
      $('session-analysis').innerHTML = `
        <div class="statgrid">
          <div class="stat"><span class="k">Length</span><span class="v">${Math.floor(A.durationS / 60)}:${String(Math.round(A.durationS % 60)).padStart(2, '0')}</span></div>
          <div class="stat"><span class="k">Hits</span><span class="v">${A.hits}</span><span class="n">${Math.round(A.hitsPerMin)} a minute</span></div>
          <div class="stat"><span class="k">Tempo</span><span class="v">${A.bpm ? `~${Math.round(A.bpm)}` : 'none'}</span><span class="n">whole session</span></div>
          <div class="stat"><span class="k">Timing spread</span><span class="v">${A.ioiDevMs != null ? `${A.ioiDevMs.toFixed(1)} ms` : 'none'}</span><span class="n">median gap from a 16th-note grid</span></div>
        </div>
        ${rows.length ? `<table class="maptable"><thead><tr><th>Drum</th><th>Hits</th><th>Velocity</th><th>Spread</th></tr></thead><tbody>${rows.map(([v, p]) => `<tr><th>${v}</th><td>${p.n}</td><td>${Math.round(p.velMean * 127)}</td><td>±${Math.round(p.velSD * 127)}</td></tr>`).join('')}</tbody></table>` : ''}`;
    }

    /* ---------- full screen, keys, quiet chrome ---------- */
    const fullscreen = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('Full screen is not available here.')); };
    $('fs-button').addEventListener('click', fullscreen);
    // A mouse click should not leave a button holding the keyboard, or Space would press it again.
    // Keyboard presses report detail 0, so keyboard users keep their focus.
    addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0 && !b.closest('dialog')) b.blur(); });
    let hideChrome = false, lastMove = performance.now();
    const wake = () => { lastMove = performance.now(); if (!hideChrome) document.body.classList.remove('quiet'); };
    ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, wake, { passive: true }));
    addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
      if (e.target.closest && e.target.closest('input, select, textarea, dialog[open]')) return;
      const key = e.key.toLowerCase();
      if (usePads && PAD_KEYS[key]) { kit.pad(PAD_KEYS[key]); return; }
      if (key === 'c') openSheet('connect');
      else if (key === 'd') toggleDemo();
      else if (key === 'f') fullscreen();
      else if (key === 'h') { hideChrome = !hideChrome; document.body.classList.toggle('quiet', hideChrome); }
      else if (cfg.onKey) cfg.onKey(e, key);
    });

    /* ---------- per-frame ---------- */
    let lastText = 0, frames = 0, fps = 0, fpsT = performance.now();
    const VOICE_ENV = ['kick', 'snare', 'hat', 'tom', 'crash', 'ride'];
    const dots = useStrip ? Object.fromEntries(VOICE_ENV.map((v) => [v, $(`dot-${v}`)])) : {};
    if (useStrip && $('hit-strip')) {
      $('hit-strip').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pad]');
        if (b && kit && kit.pad) kit.pad(b.dataset.pad);
      });
    }
    const metrics = { hitToFrame: null, seenHit: null };
    function frame(now) {
      frames++;
      if (now - fpsT > 500) { fps = (frames * 1000) / (now - fpsT); frames = 0; fpsT = now; }
      if (useStrip) VOICE_ENV.forEach((v) => { const l = Math.min(1, kit.env[v]); dots[v].style.opacity = 0.16 + l * 0.84; dots[v].style.setProperty('--l', l.toFixed(2)); });
      if (kit.lastHit && kit.lastHit !== metrics.seenHit) { metrics.seenHit = kit.lastHit; metrics.hitToFrame = now - kit.lastHit.t; }

      const playing = cfg.playing ? cfg.playing() : kit.demoOn || kit.replayOn || (kit.hitAge != null && kit.hitAge < 20000) || kit.audio.state === 'live';
      document.body.classList.toggle('playing', playing);
      const active = cfg.playing ? playing : kit.demoOn || kit.audio.state === 'live' || kit.midi.state === 'live';
      if (!hideChrome && active && now - lastMove > 9000 && !document.querySelector('dialog[open]')) document.body.classList.add('quiet');

      if (now - lastText > 120) {
        lastText = now;
        renderStates();
        const pk = (p) => (Math.max(0, Math.min(1, (20 * Math.log10(p + 1e-9) + 60) / 60)) * 100).toFixed(1) + '%';
        if (kitInputs && !cfg.connect && !$('audio-controls').hidden && $('connect-sheet').open) {
          $('meter-l').style.width = pk(kit.audio.peakL); $('meter-r').style.width = pk(kit.audio.peakR);
          $('audio-db').textContent = kit.audio.peakDb > -119 ? `${Math.round(kit.audio.peakDb)} dB` : 'silence';
        }
        if (kitInputs && !cfg.connect && $('connect-sheet').open && kit.midi.log.length) $('midi-monitor').textContent = kit.midi.log.slice(0, 5).join('\n');
        if (useSignal && $('signal-sheet').open) {
          $('sig-tempo').textContent = kit.tempo.bpm ? `~${Math.round(kit.tempo.bpm)} BPM` : 'none yet';
          $('sig-hits').textContent = kit.hits;
          const srcName = { midi: 'from MIDI', audio: 'estimated from audio', demo: 'from the demo', replay: 'from a replay', keys: 'from keyboard pads', none: 'no source yet' };
          $('sig-source').textContent = srcName[kit.hitSource];
          $('sig-peak').textContent = kit.audio.peakDb > -119 ? `${Math.round(kit.audio.peakDb)} dB` : 'none';
          $('sig-ch').textContent = kit.demoOn ? 'synthetic demo signal' : kit.replayOn ? 'recorded levels' : kit.audio.sampleRate ? `${kit.audio.channels || 2} ch · ${(kit.audio.sampleRate / 1000).toFixed(1)} kHz${kit.audio.latencyMs ? ` · about ${kit.audio.latencyMs} ms in` : ''}` : 'no audio';

    set('bsig-idx', n.idx != null ? String(Math.round(n.idx)) : n.phase);
    set('bsig-ref', n.reference ? 'ready' : `${mmss(n.seconds || 0)} / 2:00`);
    set('bsig-swing', n.swing != null ? `${n.swing.toFixed(1)} bpm` : 'none');
    set('bsig-eeg', S.eegScore != null ? `${Math.round(S.eegScore)} / 100` : eeg.state.phase);
    set('bsig-eeg-n', eeg.state.activeLabel || 'EEG · fNIRS · PRV · IMU');
    set('bsig-pts', N.toLocaleString());
    set('bsig-fps', `${Math.round(shell.fps)} fps`);
  }
  function drawBioSignal() {
    const n = bio.now, t = performance.now() / 1000;
    const trace = bio.series().filter((p) => t - p.t <= 120).map((p) => [120 - (t - p.t), p.hr]);
    lineChart('sig-trace', trace, 120, { floor: 12, empty: 'No heart-rate readings yet.' });
    const rr = bio.beats().map((b) => [32 - (t - b.t / 1000), b.rr]).filter((p) => p[0] >= 0);
    lineChart('sig-rr', rr, 32, { floor: 60, empty: 'No beat intervals yet.' });
    const nowMs = Date.now();
    const idx = (n.history || []).map((p) => [600 - (nowMs - p.timestamp) / 1000, p.value]).filter((p) => p[0] >= 0);
    lineChart('sig-index', idx, 600, { lo: 0, hi: 100, marks: [0, 25, 46, 68], empty: 'Forming reference or waiting for heart-rate sensor.' });
  }

  /* ---- Render loop ---- */
  let last = performance.now(), frameIdx = 0, slow = 0, fast = 0, fails = 0, tierLocked = false, strongGPU = false, settle = false;
  function render(now) {
    requestAnimationFrame(render);
    try {
      const dtMs = Math.min(100, now - last); last = now;
      const dt = Math.min(1 / 30, dtMs / 1000);
      kit.tick(now);
      bio.tick(now);

      const eegActive = (S.mode === 'field' && S.driver === 'brainwaves') || (S.mode === 'form' && S.formDriver === 'bio');
      eeg.tick(dt, (bio.demoOn || kit.demoOn) && eegActive);
      const q = eeg.state;
      const sm = q.sensorMode || 'eeg';
      const activeSensor = q.sensors && q.sensors[sm];
      const liveDrive = eeg.activeDrive(sm);
      S.eegValid = activeSensor ? !!(activeSensor.valid && (q.phase === 'ready' || sm === 'stillness' || sm === 'prv')) : !!(q.quality && q.quality.valid && q.phase === 'ready');
      S.eegScore = S.eegValid && Number.isFinite(q.activeScore) ? q.activeScore : (S.eegValid && Number.isFinite(q.score) ? q.score : null);
      S.eegRatio = q.ratio;
      S.eegSimulated = !!q.simulated;
      S.eegDrive = eegActive ? clamp(Number.isFinite(liveDrive) ? liveDrive : 0, 0, 1) : 0;
      S.fnirsDrive = eegActive && q.sensors && q.sensors.fnirs ? clamp(q.sensors.fnirs.drive || 0, 0, 1) : 0;
      S.stillDrive = eegActive && q.sensors && q.sensors.stillness ? clamp(q.sensors.stillness.drive || 0, 0, 1) : 0;

      shell.frame(now);
      if (!G || gl.isContextLost()) return;
      const env = kit.env, n = bio.now;

      // Update biofeedback state variables
      const loadTarget = n.phase === 'ready' && n.idx != null ? clamp(n.idx / 100, 0, 1) : 0;
      S.load += (loadTarget - S.load) * (1 - Math.exp(-dt / 2.0));
      const bioLoadTarget = BioMath.gradeLoad(n.hr, n.baseHr, bio.fullOver) * LOAD_MAX;
      S.bioLoad += (bioLoadTarget - S.bioLoad) * (1 - Math.exp(-dt / 1.5));
      S.pulse *= Math.exp(-dt / 0.26);

      if (S.mode === 'train') {
        const c = BioMath.clarity(n.swing, bio.fullSwing);
        if (c != null && n.hr != null && bio.pace.on) {
          const above = c >= CLARITY_TARGET;
          S.holdT = Math.max(0, S.holdT + (above ? dt : -dt * 0.5));
          S.dawn = clamp(S.dawn + dt * (above ? 1 / 45 : -1 / 90), 0, 1);
          if (S.holdT >= SET_SECONDS) { S.complete = true; S.holdT = SET_SECONDS; S.dawn = 1; }
        }
        S.clarity += ((c || 0) - S.clarity) * (1 - Math.exp(-dt / 1.6));
      } else {
        S.clarity *= Math.exp(-dt / 1.6);
      }

      // Upload 2-minute heart-rate history into tHrHist
      if (tHrHist && frameIdx % 6 === 0) {
        let lo = 1e9, hi = 0;
        for (let i = 0; i < 64; i++) if (bio.hist[i] > 0) { lo = Math.min(lo, bio.hist[i]); hi = Math.max(hi, bio.hist[i]); }
        const span = Math.max(12, hi - lo);
        for (let i = 0; i < 64; i++) hrBytes[i] = bio.hist[i] > 0 ? Math.round(clamp((bio.hist[i] - lo) / span, 0.1, 1) * 255) : 0;
        G.bindTex(0, tHrHist);
        gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
        gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 64, 1, gl.RED, gl.UNSIGNED_BYTE, hrBytes);
      }

      S.shapeT += ((S.shape === 1 ? 1 : 0) - S.shapeT) * Math.min(1, dt / 0.9);
      S.vortexT += ((S.shape === 2 ? 1 : 0) - S.vortexT) * Math.min(1, dt / 0.9);
      S.shellT += ((S.shape === 3 ? 1 : 0) - S.shellT) * Math.min(1, dt / 0.9);
      S.formT += ((S.mode === 'form' && F.A ? 1 : 0) - S.formT) * Math.min(1, dt / 0.8);
      if (S.perform) { S.performT += dt; setMorph(0.5 - 0.5 * Math.cos((S.performT / 24) * Math.PI * 2)); }
      else if (S.mode === 'form' && S.formDriver === 'bio') {
        const bioTarget = S.eegValid ? S.eegDrive : S.load;
        setMorph(lerp(S.morph, bioTarget, Math.min(1, dt * 2.5)));
      }

      if (dtMs > 26) slow++; else if (dtMs < 11) fast++;
      if (++frameIdx % 120 === 0) {
        if (slow > 40) {
          tierLocked = true;
          if (tierAuto && S.tier > 128) buildParticles(S.tier >> 1);
          else if (lastScale > 0.4) { lastScale *= 0.75; resize(); }
        } else if (!tierLocked && tierAuto && S.tier < 512 && strongGPU && slow < 6 && frameIdx > 240) {
          buildParticles(S.tier << 1);
        } else if (fast > 100 && lastScale < 1.6) { lastScale *= 1.2; resize(); }
        slow = 0; fast = 0;
      }

      /* camera */
      if (S.autoRot && !dragging && !RM.matches) S.yaw += dt * (0.035 + S.eegDrive * 0.045);
      const base = 1.02 * (1 - S.shapeT) + 0.2 * S.shapeT, pitch = clamp(base * (1 - S.formT) + 0.12 * S.formT + (S.pitchUser || 0), 0.05, 1.45);
      const yaw = S.yaw * (1 - Math.max(S.shapeT, S.formT)) + Math.sin(S.yaw * 0.7) * 0.12 * Math.max(S.shapeT, S.formT);
      const dist = S.dist * (1 - (RM.matches ? 0 : (env.kick + S.pulse * 0.5) * 0.022));
      const eye = [Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist];
      const asp = rw / rh;
      const fit = asp < 1 ? 1 / Math.pow(asp, 0.75) : 1;
      const eyeF = eye.map((v) => v * fit);
      const VP = mul(perspective(0.9, asp, 0.05, 40), lookAt(eyeF, [0, 0, 0], [0, 1, 0]));

      /* fluid */
      gl.disable(gl.BLEND);
      G.into(velB); G.bindTex(0, vel.tex);
      G.use(pAdvect, { uV: 0, uDt: dt, uDiss: Math.exp(-dt / 0.8) }); G.draw();
      [vel, velB] = [velB, vel];
      if (splats.length) {
        const a = new Float32Array(32), b = new Float32Array(32);
        splats.forEach((s, i) => { a.set([s.x, s.y, s.strength, s.radius], i * 4); b.set([s.fx, s.fy, s.radial, 0], i * 4); });
        G.into(velB); G.bindTex(0, vel.tex);
        G.use(pSplat, { uV: 0, uA: a, uB: b, uN: splats.length }); G.draw();
        [vel, velB] = [velB, vel];
        splats.length = 0;
      }
      const px = [1 / FV, 1 / FV];
      G.into(div); G.bindTex(0, vel.tex); G.use(pDiv, { uV: 0, uPx: px }); G.draw();
      G.use(pJac, { uP: 0, uD: 1, uPx: px });
      G.bindTex(1, div.tex);
      for (let i = 0; i < 10; i++) { G.into(presB); G.bindTex(0, pres.tex); G.draw(); [pres, presB] = [presB, pres]; }
      G.into(velB); G.bindTex(0, pres.tex); G.bindTex(1, vel.tex); G.use(pGrad, { uP: 0, uV: 1, uPx: px }); G.draw();
      [vel, velB] = [velB, vel];

      /* simulate particles */
      const histX = (kit.histX + 0.5) / kit.HIST_W, blow = S.reaction * (RM.matches ? 0.35 : 1);
      const br = bio.breath();
      const useBioHist = (S.mode === 'watch' || (S.mode === 'field' && S.driver === 'heart')) ? 1 : 0;
      const effBioLoad = S.mode === 'watch' ? S.load : (S.BioLoad || clamp(S.bioLoad / LOAD_MAX, 0, 1));
      const substeps = settle ? 150 : 1;
      settle = false;
      for (let sub = 0; sub < substeps; sub++) {
        const quiet = substeps > 1;
        G.into(simB);
        G.bindTex(0, simA.pos); G.bindTex(1, simA.vel); G.bindTex(2, tSeed); G.bindTex(3, tHist); G.bindTex(4, vel.tex); G.bindTex(5, tN);
        G.bindTex(6, tHomeA || tSeed); G.bindTex(7, tHomeB || tSeed); G.bindTex(8, tHrHist || tSeed);
        G.use(pSim, {
          uPos: 0, uVel: 1, uSeed: 2, uHist: 3, uFluid: 4, uN: 5, uHomeA: 6, uHomeB: 7, uHrHist: 8,
          uDt: quiet ? 1 / 30 : dt, uT: now / 1000, uHistX: histX, uRiver: S.shapeT, uVortex: S.vortexT, uShell: S.shellT, uForm: S.formT, uMorph: S.morph, uLoud: kit.loud,
          uKick: quiet ? 0 : env.kick, uSnare: quiet ? 0 : env.snare, uHat: quiet ? 0 : env.hat, uHatOpen: env.hatOpen, uTom: quiet ? 0 : env.tom, uTomPos: env.tomPos, uCrash: quiet ? 0 : env.crash, uBlow: blow,
          uTrain: S.mode === 'train' ? 1 : 0, uClarity: S.clarity, uBreath: br.ee, uBioLoad: effBioLoad, uEegDrive: S.eegDrive, uFnirs: S.fnirsDrive, uStillness: S.stillDrive, uPulse: quiet ? 0 : S.pulse, uUseBioHist: useBioHist,
        });
        G.draw();
        [simA, simB] = [simB, simA];
      }

      /* points */
      G.into(points); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      G.bindTex(0, simA.pos); G.bindTex(1, tSeed); G.bindTex(2, tHist); G.bindTex(3, tColA || tSeed); G.bindTex(4, tColB || tSeed);
      const dens = Math.sqrt(65536 / N);
      G.use(pPoint, {
        uPos: 0, uSeed: 1, uHist: 2, uColA: 3, uColB: 4, uVP: VP, uSize: size, uPxK: rh * 0.0058 * Math.pow(dens, 0.5), uI: (0.92 * dens * dens * 0.8 + 0.12) * (1 - 0.5 * S.shapeT * (1 - S.formT)), uHistX: histX,
        uForm: S.formT, uMorph: S.morph, uT: now / 1000, uLoud: kit.loud, uKick: env.kick, uHat: env.hat, uHatOpen: env.hatOpen, uRide: env.ride, uCrash: env.crash, uPalette: S.palette,
        uBioLoad: effBioLoad, uClarity: S.clarity, uDawn: S.dawn, uEegDrive: S.eegDrive, uFnirs: S.fnirsDrive, uPulse: S.pulse, uTrain: S.mode === 'train' ? 1 : 0,
      });
      gl.drawArrays(gl.POINTS, 0, N);
      gl.disable(gl.BLEND);

      /* trails */
      const clip = [VP[12], VP[13], VP[15]];
      const c = [0.5 + (clip[0] / clip[2]) * 0.5, 0.5 + (clip[1] / clip[2]) * 0.5];
      G.into(trailB); G.bindTex(0, points.tex); G.bindTex(1, trailA.tex);
      const fade = Math.pow((0.3 + 0.62 * S.trails) * (1 - 0.5 * S.formT) + 0.08 * env.crash, dtMs / 16.67);
      G.use(pTrail, { uPts: 0, uPrev: 1, uFade: clamp(fade, 0, 0.985), uT: now / 1000, uC: c }); G.draw();
      [trailA, trailB] = [trailB, trailA];

      /* gas and composite */
      const follow = (a, b) => a + (b - a) * (1 - Math.exp(-dt / (b > a ? 0.5 : 1.5)));
      S.gasL = follow(S.gasL || 0, kit.low); S.gasM = follow(S.gasM || 0, kit.mid); S.gasH = follow(S.gasH || 0, kit.high); S.gasV = follow(S.gasV || 0, kit.loud);
      G.into(scene); G.bindTex(0, tN); G.bindTex(1, trailA.tex);
      const scale = (3.25 / (dist * fit)) * (1 / 1.25);
      const haze = S.mode === 'train' ? (1 - S.dawn) * (1 - 0.65 * S.clarity) : 0;
      G.use(pGas, {
        uN: 0, uTrail: 1, uRiverGas: S.shapeT, uRes: [rw, rh], uC: c, uT: now / 1000, uTilt: Math.sin(pitch) * (1 - S.shapeT) + S.shapeT, uScale: scale, uYaw: yaw,
        uLow: S.gasL, uMid: S.gasM, uHigh: S.gasH, uLoud: S.gasV, uKick: env.kick, uSnare: env.snare, uHat: env.hat, uHatOpen: env.hatOpen, uRide: env.ride, uCrash: env.crash, uForm: S.formT, uPalette: S.palette,
        uBioLoad: effBioLoad, uClarity: S.clarity, uDawn: S.dawn, uEegDrive: S.eegDrive, uFnirs: S.fnirsDrive, uPulse: S.pulse, uHaze: haze,
      });
      G.draw();

      const bloom = Post.bloom(scene.tex, 0.7);
      Post.finish(scene.tex, bloom, {
        uBloomK: (0.6 + env.kick * 0.06 + env.crash * 0.12 + S.dawn * 0.25 + effBioLoad * 0.14) * S.glow, uExposure: 1.02 + S.dawn * 0.18,
        uFlash: RM.matches ? 0 : Math.min(0.1, env.flash * 0.1), uFlashC: [1, 0.94, 0.86], uGrain: 0.016, uT: now / 1000, uVig: 0.42, uSat: 1.08 + effBioLoad * 0.12, rate: RM.matches ? 0.16 : 0.36,
      }, dtMs / 1000);

      /* Dotted reference / breathing orbit ring in Watch and Train modes */
      const wantOrbit = S.mode === 'watch' ? 0.78 : S.mode === 'train' ? 0.95 : 0;
      S.orbitA += (wantOrbit - S.orbitA) * Math.min(1, dtMs / 450);
      if (S.orbitA > 0.01) {
        const sc = Math.min(1, asp * 1.15);
        const R = S.mode === 'train' ? lerp(0.22, 0.42, br.ee) * sc : 0.52 * sc;
        G.into(null);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        G.use(pOrbit, { uC: [0, S.mode === 'train' ? 0.12 : 0.18], uR: R, uAsp: asp, uT: now / 1000, uA: S.orbitA, uPx: Math.max(1.5, (cv.height / 900) * 2.1), uSquash: S.mode === 'train' ? 1 : 0.84 });
        gl.drawArrays(gl.POINTS, 0, S.mode === 'train' ? 620 : 860);
        gl.disable(gl.BLEND);
      }

      if (lumaRec) lumaRec(now);
      if (wantSnap) { const done = wantSnap; wantSnap = null; cv.toBlob((blob) => done(blob), 'image/png'); }

      if (frameIdx % 6 === 0) {
        renderReading();
        renderHud();
        if ($('connect-sheet') && $('connect-sheet').open) updateConnectDom();
        if ($('biosignal-sheet') && $('biosignal-sheet').open) {
          renderBioSignal();
          drawBioSignal();
        }
      }
    } catch (e) {
      if (fails++ < 3) console.error(e);
    }
  }

  /* ---- boot ---- */
  setMode('watch');
  if (!G || !(G.floatRT || G.gl.getExtension('EXT_color_buffer_half_float'))) {
    shell.glFail('This page needs WebGL2 with floating-point render targets, which this browser did not provide.');
    const idle = (now) => { requestAnimationFrame(idle); kit.tick(now); bio.tick(now); shell.frame(now); };
    requestAnimationFrame(idle);
  } else {
    gl = G.gl;
    try {
      Post = createPost(G);
      pSim = G.program(SIM_FS); pPoint = G.program(POINT_FS, POINT_VS); pTrail = G.program(TRAIL_FS); pGas = G.program(GAS_FS);
      pOrbit = G.program(ORBIT_FS, ORBIT_VS);
      pAdvect = G.program(ADVECT_FS); pSplat = G.program(SPLAT_FS); pDiv = G.program(DIV_FS); pJac = G.program(JAC_FS); pGrad = G.program(GRAD_FS);
      tN = G.noiseTexture(20261103);
      tHist = G.tex(kit.HIST_W, kit.BANDS, { internal: gl.RG8, format: gl.RG, type: gl.UNSIGNED_BYTE }, { data: kit.hist });
      G.bindTex(0, tHist); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      tHrHist = G.tex(64, 1, { internal: gl.R8, format: gl.RED, type: gl.UNSIGNED_BYTE }, { data: hrBytes });
      const rg = { internal: gl.RG16F, format: gl.RG, type: gl.HALF_FLOAT };
      vel = G.target(FV, FV, rg); velB = G.target(FV, FV, rg); pres = G.target(FV, FV, rg); presB = G.target(FV, FV, rg); div = G.target(FV, FV, rg);
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      strongGPU = /apple m\d+ (pro|max|ultra)|apple m[3-9]|rtx|radeon rx/i.test(info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : '');
      buildParticles(navigator.maxTouchPoints > 1 ? 128 : 256);
      resize();
      addEventListener('resize', resize);
      cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); shell.glFail('The graphics context was lost. Reload the page to get the picture back.'); });
      requestAnimationFrame(render);
    } catch (e) {
      console.error(e);
      shell.glFail(`The picture could not start on this graphics card: ${String(e.message).slice(0, 140)}`);
    }
  }

  let lumaRec = null;
  function recordLuma(ms) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true }), frames = [], t0 = performance.now();
    g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
    return new Promise((res) => {
      lumaRec = (now) => {
        g.drawImage(cv, 0, 0, 64, 36);
        const d = g.getImageData(0, 0, 64, 36).data, grid = [];
        for (let i = 0; i < d.length; i += 4) grid.push(+(0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]).toFixed(1));
        frames.push({ t: +(now - t0).toFixed(1), grid });
        if (now - t0 > ms) { lumaRec = null; res(frames); }
      };
    });
  }

  window.__app = {
    S, kit, bio, eeg, F, BioMath, recordLuma, selectDriver, selectShape, setMorph,
    get hearState() { return { playing: !!hearSrc, morph: hearMorph, rebuilds: hearRebuilds }; },
    get N() { return N; },
    pixel() {
      const c = document.createElement('canvas'); c.width = 32; c.height = 18;
      const g = c.getContext('2d');
      return new Promise((res) => { wantSnap = (blob) => { const im = new Image(); im.onload = () => { g.drawImage(im, 0, 0, 32, 18); const d = g.getImageData(0, 0, 32, 18).data; let sum = 0, min = 1e9, max = 0; const grid = []; for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.2126 + d[i + 1] * 0.7152 + d[i + 2] * 0.0722; sum += l; min = Math.min(min, l); max = Math.max(max, l); grid.push(l); } res({ mean: sum / (d.length / 4), min, max, grid }); }; im.src = URL.createObjectURL(blob); }; });
    },
  };
})();

</script>
</body>
